.rc b{font-size:13.5px}.rc.gold{background:#fbefd3}.rc.dim{opacity:.75}.rc.kira{background:#f9e2ee}
.chres .grade{margin:0 0 8px;font-size:18px;text-align:left}
.gotrow{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px}
.gotc{position:relative;width:92px;cursor:pointer;animation:appear .5s var(--d) cubic-bezier(.2,.8,.2,1.2) backwards}
.gotc .card,.gotc .cback{width:92px!important}
.gotc .card .nt,.gotc .card .tags{display:none}
.gotc.on .card,.gotc:hover .card{box-shadow:0 0 0 3px var(--orange)}
.gottag{position:absolute;z-index:2;top:-9px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#fff;border-radius:99px;padding:1px 8px;white-space:nowrap}
.gotc.get .gottag{background:#e9a93a}.gotc.add .gottag{background:#7f9fd6}
.gotc.get .card{box-shadow:0 0 0 2px #e9b44c}
.gothint{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
@media (max-width:520px){.chcard .card{width:120px}.chance{gap:10px}}
@media (max-height:520px){.chcard .card{width:116px}.rc{padding:5px 10px}}
.peek .card.cur{opacity:.6;box-shadow:0 0 0 2px #b9aeb8}
.peek .card.cur::after{content:'いま置いている';position:absolute;z-index:2;top:50%;left:50%;transform:translateX(-50%);box-shadow:0 2px 5px rgba(0,0,0,.2);font-size:10.5px;font-weight:800;color:#fff;background:#9a8f9f;border-radius:99px;padding:1px 8px;white-space:nowrap}
#goalPop{position:fixed;left:50%;top:42%;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);width:min(440px,calc(100vw - 32px));text-align:center;background:var(--gc,#f3e6dc);color:var(--ink);border:3px solid #fff;border-radius:28px;padding:22px 22px 20px;box-shadow:0 18px 50px rgba(75,68,83,.35)}
#goalPop .gi{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:36px}
#goalPop b{display:block;color:var(--ink);font-size:26px;line-height:1.3}
#goalPop small{display:block;font-size:15px;opacity:.8;margin-top:6px}
#goalPop.go{animation:goalPop 2.1s cubic-bezier(.2,.8,.2,1) forwards}
#goalPop.go.long{animation-duration:3s}
@keyframes goalT{0%{opacity:0;transform:scale(.8) translateY(6px)}35%{opacity:1;transform:scale(1.07) translateY(0)}55%{transform:scale(1)}72%{transform:scale(1.045)}100%{transform:scale(1)}}
#sheetGoal b{display:inline-block;animation:goalT 1.5s cubic-bezier(.2,.8,.2,1) both}
#goalPop b{animation:goalT 1.5s cubic-bezier(.2,.8,.2,1) both}
#sheetTitle.tin{animation:goalT 1.1s cubic-bezier(.2,.8,.2,1) both}
#goalPop small .pr{display:inline;font-size:20px;color:var(--orange)}
@keyframes goalPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#goalPop.go{animation-duration:2.4s}}
.sheet.two .sheet-actions .vinline{flex:0 0 auto;min-height:0;padding:8px 10px}
/* visual info: badges, bars and matchup pills instead of sentences */
.vi{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink);min-width:0}
.vi .vh{font-weight:800;font-size:15px;line-height:1.25}
.vi .vb{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.eb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--e);color:#fff;font-weight:800;font-size:12.5px;flex:0 0 auto;box-shadow:0 0 0 2px #fff}
.pb{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:7px;background:#f1e3c8;color:#6a5030;font-weight:800;font-size:12.5px;flex:0 0 auto}
.sbg{display:inline-block;padding:2px 8px;border-radius:999px;background:#f3eee8;font-weight:700;font-size:11.5px}
.vi .vbar{display:grid;grid-template-columns:18px 1fr 30px;gap:6px;align-items:center}
.vi .vbar svg{width:15px;height:15px}
.vi .vbar>span{height:8px;border-radius:999px;background:#f1ebe4;overflow:hidden}
.vi .vbar>span i{display:block;height:100%;border-radius:999px}
.vi .vbar.atk{color:#c9605a}.vi .vbar.atk i{background:#e9938a}
.vi .vbar.hp{color:#4f9a6a}.vi .vbar.hp i{background:#8fc6a2}
.vi .vbar b{font-family:var(--f-num);font-size:14px;text-align:right;color:var(--ink)}
.vi .vcost{display:flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:800;font-size:14px}.vi .vcost .coin{width:16px;height:16px}
.vi .vmu{display:flex;gap:6px;flex-wrap:wrap}
.mu{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 3px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.mu .eb{width:20px;height:20px;font-size:11px;box-shadow:none}
.mu.good{background:#e3f1e6;color:#3f8a5a}.mu.bad{background:#f8e3e0;color:#c0605a}.mu.even{background:#f1ece6;color:#7d7385}
.vi .vfit{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;background:#f6f1eb;font-weight:800}
.vi .vfit.good{background:#e3f1e6;color:#3f8a5a}
.vi .vfit.good{animation:vfitGood 1.5s ease-in-out infinite}
.vi .vfit.bad{animation:vfitBad .85s ease-in-out infinite}
@keyframes vfitGood{0%,100%{background:#e3f1e6}50%{background:#c9ecd2}}
@keyframes vfitBad{0%,100%{background:#f8e3e0}50%{background:#f2c9c2}}
.vi .vfit .arw{color:var(--muted);font-weight:400}
.vi .vnote{color:var(--muted);font-size:11.5px;line-height:1.45}
.vi .vfx{font-family:var(--f-num);font-weight:800;font-size:22px;color:#c4615a}
#peek{flex-direction:column;align-items:center;width:240px!important;padding:12px 14px 14px}
#peek .card{width:150px}
#peek .vi{width:100%}
#peek.inline{display:none}
.vinline{box-sizing:border-box;background:#fbf7f2;border-radius:16px;padding:10px 12px;min-height:118px}
.vwarn{background:#fdeee7;border:1.5px solid #e8a58c;border-radius:10px;padding:7px 9px}.vwarn-t{font-weight:900;color:#c2502e}
.offmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:max-content;background:rgba(178,54,34,.95);color:#fff;font-weight:900;font-size:12px;letter-spacing:.02em;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.card.off.hl .offmark{opacity:1}
.vi .vrow{display:flex;flex-direction:column;gap:7px}
.vinline .vi .vrow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
.vinline .vi .vfit{padding:3px 8px}
.vinline .vi{gap:5px}
.vinline:empty:not([style]){display:none}
/* square info */
.tv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center}
.tv-art{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.tv-art svg{display:block;width:100%;height:auto}
.tv-side{display:flex;flex-direction:column;gap:8px}
.tv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.tv-big{font-family:var(--f-num);font-size:26px;font-weight:800;line-height:1}
.tv-big small{font-size:12px;color:var(--muted);font-family:inherit;margin-left:2px}
.tv-own{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,#fff);font-weight:800;font-size:13px}
.tv-own .face{width:26px;height:26px;border-radius:50%}
.tv-lv{color:#e0a93a;letter-spacing:1px;font-size:15px}
.tv-lv i{color:#e6ddd3;font-style:normal}
.tv-mon{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:start;padding-top:10px;border-top:1.5px dashed var(--line)}
.tv-mon .card{width:130px}
.tv-tip{display:flex;flex-direction:column;gap:7px}
.tv-tip .lead{font-weight:800;font-size:12px;color:var(--muted)}
.tv-ev{display:flex;gap:10px;flex-wrap:wrap}
.tv-ev .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:#f6f1eb;font-weight:800}
.tv-ev .chip .coin{width:18px;height:18px}
.tv-ev .chip b{font-family:var(--f-num);font-size:18px}
/* battle games */
.bmroul{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.bmroul small{color:var(--muted);font-weight:700}
.bmroul b{font-family:var(--f-display);font-size:26px;color:var(--ink)}
.bmroul b.pop{animation:gradepop .4s;color:#c4615a}
.bmroul span{font-size:13px;color:var(--muted)}
.bgame{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.bgame .lbl{font-weight:700;font-size:14px}
.bgame .grade small{display:block;font-size:14px;font-family:inherit;color:var(--muted);font-weight:700}
.bgame .gnote{text-align:center;font-size:13px;color:var(--muted);min-height:1.4em}
.bgame .gbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.bgame .gbtns .btn{flex:1 1 140px}
.vfind{position:relative;height:170px;border-radius:16px;background:linear-gradient(160deg,#eef3ea,#f7efe6);overflow:hidden;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 1px var(--line)}
.vfind .cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid rgba(196,97,90,.7);border-radius:50%}
.vfind .cross::before,.vfind .cross::after{content:"";position:absolute;background:rgba(196,97,90,.7)}
.vfind .cross::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}.vfind .cross::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
.vfind .cnr{position:absolute;width:18px;height:18px;border:3px solid #4b4453;opacity:.55}
.vfind .cnr.a{left:10px;top:10px;border-right:0;border-bottom:0}.vfind .cnr.b{right:10px;top:10px;border-left:0;border-bottom:0}
.vfind .cnr.c{left:10px;bottom:10px;border-right:0;border-top:0}.vfind .cnr.e{right:10px;bottom:10px;border-left:0;border-top:0}
.vmon{position:absolute;width:84px;height:63px;transform:translate(-50%,-50%);pointer-events:none}
.vmon svg{width:100%;height:100%}
.vflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vfind.snap .vflash{animation:vflash .5s}
@keyframes vflash{0%{opacity:.95}100%{opacity:0}}
.gacha{display:flex;align-items:center;justify-content:center;gap:16px}
.gmach svg{width:62px;height:72px}
.gcaps{display:flex;gap:10px}
.gcap{width:62px;height:62px;border-radius:50%;border:2px solid #4b4453;background:linear-gradient(180deg,#f3eee8 50%,#fff 50%);font:inherit;font-weight:800;font-size:18px;color:#4b4453;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:default}
.gcap small{font-size:11px;font-weight:700}
.gcap.open{background:linear-gradient(180deg,var(--gc) 50%,#fff 50%);animation:gradepop .35s}
.gcap.open.rSSR{box-shadow:0 0 14px rgba(224,169,58,.9)}
.gcap:not(:disabled){cursor:pointer;outline:2px dashed var(--orange);outline-offset:3px}
.gcap.spin{animation:capspin .45s linear}
@keyframes capspin{to{transform:rotate(360deg)}}
.gcap.landD{animation:landD .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes landD{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.kai{display:flex;flex-direction:column;gap:10px}
.kbill{display:flex;align-items:baseline;gap:12px;justify-content:center;background:#fff;border-radius:6px;padding:8px 12px;box-shadow:0 2px 8px rgba(75,68,83,.1);font-family:var(--f-num)}
.kbill small{color:var(--muted);font-weight:700}.kbill>b{font-size:28px}
.kbill span{font-size:13px;color:var(--muted)}.kbill span b{font-size:18px;color:var(--ink)}.kbill span b.over{color:#c0605a}
.kcoins{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:440px;align-self:center}
.kc{aspect-ratio:1;border-radius:50%;border:2px solid #b98a3a;background:radial-gradient(circle at 35% 30%,#fff6d6,#e8c56e);font:inherit;font-family:var(--f-num);font-weight:800;font-size:clamp(11px,3.2vw,15px);color:#6a4a10;cursor:pointer;padding:0;touch-action:manipulation}
.kc.k1,.kc.k5{background:radial-gradient(circle at 35% 30%,#fff,#d8d4cf);border-color:#9a948c;color:#5a554f}
.kc.k10{background:radial-gradient(circle at 35% 30%,#ffe2c8,#c98a52);border-color:#9a5f2a;color:#5a3010}
.kc.k500{border-width:3px}
.kc.kclr{border-radius:12px;aspect-ratio:auto;background:#fff;border-color:var(--line);color:var(--ink);font-family:inherit;font-size:12px}
.kc:active{transform:scale(.92)}
.kc:disabled{cursor:default}
.hilo{display:flex;align-items:center;justify-content:center;gap:16px}
.hlc{width:64px;height:88px;border-radius:10px;background:#fff;border:2px solid #4b4453;display:grid;place-items:center;font-family:var(--f-num);font-size:34px;font-weight:800;animation:gradepop .3s;box-shadow:0 3px 8px rgba(75,68,83,.15)}
.hlc.back{background:repeating-linear-gradient(45deg,#e0907a 0 6px,#ecac98 6px 12px);color:#fff}
.hla{font-size:22px;color:var(--muted)}
.hlpips{display:flex;gap:6px;justify-content:center}
.hlpips i{width:14px;height:14px;border-radius:50%;background:#eee6de}
.hlpips i.ok{background:#6fa784}.hlpips i.ng{background:#c0605a}
.slotm{display:flex;gap:8px;justify-content:center;padding:10px;border-radius:16px;background:linear-gradient(180deg,#f7d8cf,#f3e6c8);cursor:pointer;touch-action:manipulation}
.reel{width:76px;height:76px;border-radius:12px;background:#fff;box-shadow:inset 0 3px 6px rgba(75,68,83,.18);display:grid;place-items:center;overflow:hidden}
.reel.stopped{box-shadow:inset 0 3px 6px rgba(75,68,83,.18),0 0 0 3px #e0a93a}
.sym{font-size:40px;font-weight:800;line-height:1}
.sym.heart{color:#e07a8f}.sym.coin{color:#c08a1e}.sym.star{color:#e0b33a}.sym.bell{color:#7f8fc4}.sym.leaf{color:#6fa784}
.sym.mon svg{width:72px;height:54px;display:block}
/* the player chips and map buttons sit in a bar above the map, never on top of it */
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.mapbar .hud{position:static!important;inset:auto;flex:1 1 auto;min-width:0;pointer-events:auto}
.mapctl{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto}
.mapbar .mapbtn{position:static!important;padding:5px 12px}
.mapbar .zbtns{position:static!important;flex-direction:row;gap:6px}
.mapbar .zbtns button{width:32px;height:32px}
body:not(.ingame) .mapbar{display:none}
/* roll / skill buttons copied into the map bar while the real ones are scrolled out of sight */
.qact{display:flex;gap:6px}.qact[hidden]{display:none}
.qact .btn{padding:5px 14px;min-height:0;white-space:nowrap;animation:qin .3s cubic-bezier(.2,.8,.2,1.2)}
.qact .btn:disabled{display:none}
@keyframes qin{from{transform:scale(.7);opacity:0}}
/* squares react to the pointer so it is clear they can be tapped for details */
@media (hover:hover){
  .tile{transition:transform .15s,box-shadow .15s,filter .15s}
  .viewport:not(.dragging) .tile:hover{transform:translateY(-2px) scale(1.06);z-index:2;box-shadow:0 0 0 2.5px var(--orange),0 8px 18px rgba(75,68,83,.22);filter:saturate(1.15) brightness(1.03)}
  .viewport:not(.dragging) .tile:hover::after{content:"i";position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--orange);color:#fff;font:800 10px/15px Quicksand,sans-serif;text-align:center;pointer-events:none}
  .viewport .tile{cursor:pointer}
}
/* map: drag to move, wheel / pinch / buttons to zoom */
.viewport{touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.viewport *{-webkit-user-drag:none}
.maphint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(75,68,83,.82);color:#fff;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;pointer-events:none;animation:appear .3s}
.viewport.dragging{cursor:grabbing}
.zbtns{position:absolute;right:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:6px}
.zbtns button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);font:inherit;font-size:19px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(75,68,83,.15);display:grid;place-items:center;padding:0}
.zbtns button[hidden]{display:none}
.zbtns svg{width:16px;height:16px}
/* card row in choice sheets: linked with the list below */
.peek.crow{scroll-padding:0 28px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:28px 14px 20px;margin:0 -6px;scrollbar-width:thin}
.peek.crow::after,.peek.crow::before{content:"";flex:1 0 0}
.peek .card.pick{cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.3,1.3),box-shadow .18s;flex:0 0 auto}
.peek .card.pick.hl{transform:translateY(-4px) scale(1.12);box-shadow:0 0 0 2.5px var(--orange),0 10px 22px rgba(75,68,83,.22);z-index:2;position:relative}
.peek .card.pick.off{filter:grayscale(.6);cursor:not-allowed}
.peek .card.pick.off::before{content:'';position:absolute;inset:0;background:rgba(252,250,246,.5);z-index:5;pointer-events:none}
/* card peek beside choice sheets, and the affinity guide */
#peek{position:fixed;z-index:26;pointer-events:none;display:flex;gap:12px;align-items:flex-start;background:#fffdfa;border-radius:20px;padding:12px;box-shadow:0 10px 32px rgba(75,68,83,.22);width:min(400px,calc(100vw - 24px));opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
#peek.on{opacity:1;transform:none}
#peek .card{width:150px;flex:0 0 auto;transform:none!important;margin:0!important}
#peek .pk{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.5;color:var(--ink)}
#peek .pk b.h{font-size:15px}
#peek .pk .row{display:flex;gap:6px;flex-wrap:wrap}
#peek .pk .chip{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;background:#f3eee8;font-weight:700;font-size:11.5px}
#peek .pk .good{color:#3f8a5a}#peek .pk .bad{color:#c0605a}
#peek .pk .hint{color:var(--muted);font-size:11.5px}
#peek.compact .card{width:118px}
#peek.slim .card{display:none}
.btn.opt.peeking{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.guidebtn svg{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
#guide{position:fixed;inset:0;z-index:35;background:rgba(75,68,83,.38);display:flex;align-items:center;justify-content:center;padding:12px}
#guide[hidden]{display:none}
#guide .gcard{background:#fffdfa;border-radius:24px;width:min(620px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(75,68,83,.25);display:flex;flex-direction:column;gap:12px}
#guide .ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
#guide h2{margin:0;font-size:21px}
#guide .gtabs{display:flex;gap:6px;flex-wrap:wrap}
#guide .gtabs button{flex:1 1 0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
#guide .gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#guide .gsec{display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6}
#guide .wheel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
#guide .wheel svg{width:230px;height:230px;flex:0 0 auto}
#guide .wheel ul{margin:0;padding-left:1.1em;min-width:200px;flex:1 1 200px}
#guide table{border-collapse:collapse;width:100%;font-size:13px}
