<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>アゲモン 試作版</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: one-screen board game. A 9x8 ring of Ageo places with a HUD core inside, player strip and hand rail below, a sheet for every choice. Deliberately dark (anime HUD), single theme. */
:root{
  --bg:#0b0f21; --panel:#141a35; --panel2:#1b2246; --line:#2b3668; --text:#eef0ff; --muted:#98a1d3;
  --orange:#f39a2e; --green:#3fae6a;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
  --e-honoo:#ff6a3d; --e-kusa:#4cc46a; --e-tsuchi:#c99a4a; --e-kaze:#3fd0c4; --e-denki:#f5d53b; --e-mizu:#4a9dff;
  --p0:#f39a2e; --p1:#3fae6a; --p2:#5aa8ff; --p3:#e65fb0;
  --good:#5be08a; --bad:#ff6b6b;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16.1px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(90,110,200,.07) 0),linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(90,110,200,.07) 0);
  background-size:28px 28px}
button,select,input{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:clamp(23px,5.8vw,29.9px);white-space:nowrap;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:10px}
.logo .stripe{display:inline-block;width:38px;height:8px;background:linear-gradient(var(--orange) 0 50%,var(--green) 50%);transform:skewX(-20deg)}
.logo small{display:none;font-family:var(--f-num);font-size:12.6px;color:var(--muted);letter-spacing:.2em}
.btn{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tile:focus-visible,.seg button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a1000}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent}

@media (min-width:520px){.logo small{display:inline}}
/* board */
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(8,1fr);gap:3px;width:100%;aspect-ratio:9/8;padding:16px;box-sizing:border-box}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 3px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;min-width:0;text-align:left}
.tile .nm{font-size:clamp(7px,1.55vw,11px);font-weight:700;line-height:1.15;word-break:break-all}
.tile .pl{position:absolute;right:2px;top:1px;font-size:clamp(7px,1.3vw,10px);color:var(--muted)}
.tile .gl{align-self:center;font-family:var(--f-display);font-size:clamp(10px,2.6vw,20px);line-height:1}
.tile .ft{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-num);font-size:clamp(7px,1.3vw,10px);color:var(--muted);min-height:1em}
.tile.owned{border-width:2px}
.tile.k-start{background:linear-gradient(135deg,rgba(243,154,46,.25),rgba(63,174,106,.25))}
.tile.k-grass .gl{color:var(--e-kusa)}
.tile.k-card .gl{color:var(--e-denki)}
.tile.k-event .gl{color:var(--e-honoo)}
.tile.cp::after{content:"★";position:absolute;left:2px;bottom:0;font-size:clamp(7px,1.4vw,11px);color:var(--orange)}
.tile .tok{position:absolute;inset:auto 2px 2px auto;display:flex;gap:1px}
.tile .tok i{width:clamp(5px,1.3vw,10px);height:clamp(5px,1.3vw,10px);border-radius:50%;border:1px solid #000;display:block}
.tile.here{box-shadow:0 0 0 2px var(--text) inset}
.core{background:rgba(20,26,53,.85);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"turn dice" "log dice" "goal dice";gap:4px 14px;align-items:center;min-width:0}
.core .turnline{grid-area:turn}.core .dicebox{grid-area:dice}.core .log{grid-area:log}.core .goal{grid-area:goal}
.viewport{position:relative;width:100%;aspect-ratio:9/8;overflow:hidden;border-radius:8px;background:radial-gradient(ellipse at 50% 50%,rgba(63,174,106,.12),transparent 70%),#0d1228;border:1px solid var(--line)}
.board{transform-origin:0 0;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.board.nojump{transition:none}
.mapart{grid-column:2/9;grid-row:2/8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;border:1px dashed rgba(90,110,200,.25);border-radius:10px;background:repeating-linear-gradient(45deg,rgba(90,110,200,.05) 0 2px,transparent 2px 14px)}
.mapart b{font-family:var(--f-display);font-weight:400;font-size:clamp(32.2px,10.3vw,73.6px);color:rgba(238,240,255,.08);letter-spacing:.2em;line-height:1}
.mapart span{font-family:var(--f-num);font-size:clamp(9.2px,2.1vw,13.8px);letter-spacing:.5em;color:rgba(152,161,211,.35)}
.mapbtn{position:absolute;right:8px;bottom:8px;z-index:3;padding:5px 10px;font-size:13.8px;background:rgba(20,26,53,.9)}
.tile .mp{display:none;position:absolute;inset:0;opacity:.42;pointer-events:none}
.tile .mp .por{width:100%;height:100%;border-radius:0}
.tile .nm,.tile .ft,.tile .gl{position:relative;z-index:1}
.tile .tok{z-index:2}
.viewport.follow{aspect-ratio:3/2}
.board.zoom .tile .mp{display:block}
.board.zoom .tile.has-mon .gl{opacity:0}
.board.zoom .tile .nm{font-size:clamp(6px,1.2vw,9px)}
.board.zoom .tile .tok i{width:clamp(7px,1.7vw,12px);height:clamp(7px,1.7vw,12px);border:1.5px solid #fff;box-shadow:0 0 5px #000}
.turnline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.turnline b{font-family:var(--f-display);font-size:clamp(16.1px,4.1vw,27.6px);font-weight:400}
.turnline span{font-family:var(--f-num);color:var(--muted);font-size:clamp(11.5px,2.3vw,14.9px)}
.dicebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.die{width:clamp(48px,12vw,64px);aspect-ratio:1;border-radius:10px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:clamp(25.3px,6.9vw,46px)}
.log{font-size:13.8px;color:var(--muted);display:flex;flex-direction:column;gap:1px;min-height:4.5em}
.log div:last-child{color:var(--text)}
#goal{font-size:12.6px;color:var(--muted)}
#goalUpBtn{margin-left:8px;background:linear-gradient(180deg,#ffd98a,#f2b64e);border:1px solid #cf9426;color:#6d4c05;font-weight:900;font-size:11.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
#goalUpBtn:active{transform:scale(.96)}
#goal b{font-family:var(--f-num);color:var(--orange)}

/* players */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pchip{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:13.8px}
.pchip.now{background:var(--panel2);border-color:var(--c)}
.pchip .n{font-weight:700;font-size:14.9px}
.pchip .t{font-family:var(--f-num);font-weight:700;font-size:18.4px;text-align:right}
.pchip .s{color:var(--muted);font-variant-numeric:tabular-nums}
.pchip .cps{color:var(--muted)}
.pchip .cps .on{color:var(--orange)}

/* hand */
.handbar{display:flex;justify-content:space-between;align-items:baseline}
.handbar h2{font-size:14.9px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.08em}
.hand{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.card{flex:0 0 auto;width:132px;background:linear-gradient(180deg,#fffdf8 0%,var(--panel) 78%);border:1px solid var(--line);border-top:4px solid var(--ec);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:0 2px 7px rgba(75,68,83,.14)}
.card .cn{font-weight:700;font-size:14.9px;line-height:1.25}
.card .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.tag.el{border-color:var(--ec);color:var(--ec)}
.card .st{display:flex;gap:8px;font-family:var(--f-num);font-size:13.8px}
.card .st b{font-weight:700}
.card .nt{font-size:12.1px;color:var(--muted);line-height:1.35}
.card.item{--ec:var(--muted)}
.card.rare{box-shadow:0 0 0 1.5px var(--e-denki) inset,0 2px 9px rgba(75,68,83,.2)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(5,7,18,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.sheet{align-items:center}}
.sheet-card{width:min(592px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:10px 10px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet-card{border-radius:10px}}
.sheet-card h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;text-wrap:balance}
.sheet-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px}
.sheet-actions .btn{flex:1 1 auto}
#sheetActions{flex:0 0 auto}
.sheet.has-none-tile #sheetActions .btn.bp-none{display:none}
.muted{color:var(--muted)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.arena .vs{font-family:var(--f-display);font-size:25.3px;align-self:center;color:var(--orange)}
.fighter{display:flex;flex-direction:column;gap:6px;min-width:0}
.fighter .who{font-size:12.6px;color:var(--muted)}
.fighter .card{width:auto}
.hpbar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.hptext{font-family:var(--f-num);font-size:13.8px}
.bonus{font-size:12.6px;color:var(--muted)}
.blog{font-size:14.9px;display:flex;flex-direction:column;gap:2px;background:var(--panel2);border-radius:6px;padding:8px 10px}
.blog .hit{color:var(--orange);font-weight:700}
.timing{display:flex;flex-direction:column;gap:6px}
.tbar{position:relative;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.tbar .good{position:absolute;top:0;bottom:0;background:rgba(63,174,106,.28)}
.tbar .perfect{position:absolute;top:0;bottom:0;background:rgba(243,154,46,.7)}
.tbar .mk{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--text);box-shadow:0 0 8px var(--text)}
.grade{font-family:var(--f-display);font-size:25.3px;text-align:center;min-height:1.3em}
.grade.p{color:var(--orange)} .grade.g{color:var(--good)} .grade.m{color:var(--muted)}
.dicerow{display:flex;align-items:center;gap:12px;justify-content:center}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;width:100%}
.opt small{color:var(--muted);font-weight:400}
.adv{color:var(--good)} .dis{color:var(--bad)}

/* setup */
.setup{display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--orange);color:#1a1000;font-weight:700}
.prow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--panel2);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px}
.prow .fields{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ctnote{flex-basis:100%}
.prow input{width:9em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.prow select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:100%}
.lbl{font-size:13.8px;color:var(--muted)}
.note{font-size:13.8px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;border-left:4px solid var(--c);background:var(--panel2);padding:6px 10px;border-radius:4px}
.rank b{font-family:var(--f-num)}

/* art + fx */
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hbtns .btn{padding:6px 10px;font-size:13.8px}
.por{display:block;width:100%;height:auto;border-radius:7px;background:#0e1329;box-shadow:inset 0 0 0 1px rgba(75,68,83,.18),0 1px 3px rgba(75,68,83,.12)}
.card .por{margin:-2px 0 2px}
.tile .ft svg{width:1.15em;height:1.15em;vertical-align:-.2em}
.tile.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.18);box-shadow:0 0 18px var(--orange)}100%{transform:scale(1)}}
.tile.here{animation:here 1.2s ease-in-out infinite}
@keyframes here{50%{box-shadow:0 0 0 2px var(--text) inset,0 0 12px rgba(238,240,255,.5)}}
.die.spin{animation:spin .45s linear}
@keyframes spin{from{transform:rotate(0) scale(.9)}to{transform:rotate(360deg) scale(1)}}
.fighter{position:relative}
.fighter.hit .card{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-7px,2px)}35%{transform:translate(7px,-2px)}55%{transform:translate(-5px,1px)}75%{transform:translate(4px,0)}}
.dmg{position:absolute;left:50%;top:28%;transform:translate(-50%,0);font-family:var(--f-display);font-size:39.1px;color:#fff;text-shadow:0 0 6px var(--orange),0 2px 0 #000;pointer-events:none;animation:dmg 1s ease-out forwards}
.dmg.crit{font-size:52.9px;color:var(--e-denki)}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.slash{position:absolute;inset:10% 5% auto;height:60%;pointer-events:none}
.slash path{stroke-dasharray:200;stroke-dashoffset:200;animation:slash .35s ease-out forwards}
@keyframes slash{to{stroke-dashoffset:0;opacity:.0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;background:#fff;opacity:0}
#fx.flash{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.card.caught{animation:caught 1s ease-out}
@keyframes caught{0%{box-shadow:0 0 0 0 var(--e-denki)}40%{box-shadow:0 0 0 6px var(--e-denki),0 0 30px var(--e-denki)}100%{box-shadow:0 0 0 0 transparent}}
.card.fled{animation:shake .45s;opacity:.55}
.vs{animation:vs 1.2s ease-in-out infinite}
@keyframes vs{50%{transform:scale(1.15);text-shadow:0 0 12px var(--orange)}}
.hero{position:relative;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,rgba(243,154,46,.35),transparent 60%),#0e1329;border:1px solid var(--line)}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 8px 0}
.hero .ttl{font-family:var(--f-display);font-size:clamp(29.9px,9.2vw,46px);text-align:center;letter-spacing:.06em;line-height:1;padding:6px 0 2px;text-shadow:0 0 18px rgba(243,154,46,.6)}
.hero .sub{font-family:var(--f-num);text-align:center;font-size:12.6px;letter-spacing:.35em;color:var(--muted);padding-bottom:10px}
.hero .stripe2{height:6px;background:linear-gradient(var(--orange) 0 50%,var(--green) 50%)}
.board{position:relative}
@media (prefers-reduced-motion:reduce){.hpbar i{transition:none}*{animation:none!important}}
/* ===== visual overhaul (v4): illustrated board, pieces, TCG cards, 3D dice, battle stage, cut-ins ===== */
body{background-color:var(--bg);background-image:radial-gradient(900px 520px at 50% -8%,rgba(90,110,255,.24),transparent 60%),radial-gradient(700px 500px at 110% 90%,rgba(243,154,46,.12),transparent 60%),linear-gradient(transparent 0 calc(100% - 1px),rgba(90,110,200,.07) 0),linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(90,110,200,.07) 0);background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed}
.logo .word{font-style:italic;background:linear-gradient(180deg,#fff 0 40%,#ffd27a 55%,#f39a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #6b2f00) drop-shadow(0 0 10px rgba(243,154,46,.45));padding-right:.12em}
.btn{border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.primary{background:linear-gradient(180deg,#ffc06a,#f39a2e 55%,#d9761a);border-color:#ffd9a0;color:#1a0d00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 3px 0 #8a4300,0 0 14px rgba(243,154,46,.35)}
.btn.primary:active:not(:disabled),.btn.skill:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.skill{background:linear-gradient(180deg,#ff9fd8,#e65fb0 55%,#b8358a);border-color:#ffc4e6;color:#2a0018;box-shadow:0 3px 0 #6e1450,0 0 12px rgba(230,95,176,.35)}
.btn.opt{background:linear-gradient(180deg,#232b5c,#1a2148);border-color:#3a4785}
.btn.opt:hover:not(:disabled){border-color:var(--orange);box-shadow:0 0 0 1px var(--orange),0 2px 0 rgba(0,0,0,.45)}

/* board */
.viewport{background:#0c1430;box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.5);border-color:#33407a}
.mapart{border:0;background:none;padding:0;display:block;overflow:hidden;border-radius:8px;box-shadow:inset 0 0 24px rgba(0,0,0,.7),0 0 0 1px #2b3668}
.mapart svg{width:100%;height:100%;display:block}
.tile{padding:0;background:#10152e;border:1px solid rgba(150,170,255,.3);border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.55)}
.tile .art{position:absolute;inset:0;z-index:0;pointer-events:none}
.tile .art svg{width:100%;height:100%;display:block}
.tile::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,22,.82) 0,rgba(6,8,22,.1) 34%,rgba(6,8,22,0) 60%,rgba(6,8,22,.85) 100%)}
.tile .nm{position:relative;z-index:2;padding:2px 3px 0;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.tile .ft{position:relative;z-index:2;padding:0 3px 2px;color:#fff;text-shadow:0 1px 2px #000;margin-top:auto}
.tile .ft .lv{font-style:normal;color:#f5d53b;letter-spacing:-.15em;margin-left:1px}
.lvbig{display:inline-flex;flex-direction:column;align-items:center;line-height:.8;vertical-align:middle;font-style:normal}
.lvbig b{font-weight:900;font-size:.95em;line-height:1}
.lvbig i{font-style:normal;font-size:.95em;line-height:1}
.tile .ft .x2{color:#ff6b6b;margin-right:2px}
.tile .mp{z-index:1;opacity:.9}
.tile .badge{display:none;position:absolute;z-index:2;left:50%;top:52%;transform:translate(-50%,-50%);width:clamp(14px,3.8vw,28px);aspect-ratio:1;border-radius:50%;place-items:center;font-family:var(--f-display);font-size:clamp(8px,2vw,14px);line-height:1;color:#fff;text-shadow:0 1px 1px #000;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),transparent 50%),var(--bc);border:2px solid var(--oc);box-shadow:0 0 8px var(--bc),0 1px 2px #000}
.tile.has-mon .badge{display:grid}
.board.zoom .tile .badge{left:auto;right:3px;top:auto;bottom:22%;transform:none;width:clamp(10px,2.6vw,18px);font-size:clamp(6px,1.4vw,10px);border-width:1.5px}
.tile .flag{display:none}
.tile.owned .flag{display:block;position:absolute;z-index:2;right:0;top:0;width:0;height:0;border-style:solid;border-width:0 clamp(9px,2.2vw,16px) clamp(9px,2.2vw,16px) 0;border-color:transparent var(--oc) transparent transparent}
.tile.owned{border:2px solid var(--oc);box-shadow:0 0 0 1px #000,0 0 10px color-mix(in srgb,var(--oc) 55%,transparent)}
.tile.boost{animation:boost 1s ease-in-out infinite}
@keyframes boost{50%{box-shadow:0 0 0 1px #000,0 0 14px #ff6b6b}}
.tile.cp::after{z-index:2;text-shadow:0 0 4px #000;font-size:clamp(8px,1.6vw,13px);bottom:auto;top:calc(1.2em + 4px);left:3px}
.tile.here{box-shadow:0 0 0 2px #fff inset,0 0 14px rgba(255,255,255,.6)}
.pieces{position:absolute;inset:0;pointer-events:none;z-index:5}
.piece{position:absolute;width:3.8%;aspect-ratio:4/5;margin-left:-1.9%;margin-top:-4.5%;transition:left .17s ease-out,top .17s ease-out}
.piece svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.piece.now{z-index:2}
.piece.now svg{animation:bob 1.1s ease-in-out infinite}
.piece.hop svg{animation:hop .18s ease-out}
@keyframes bob{50%{transform:translateY(-10%)}}
@keyframes hop{50%{transform:translateY(-45%) scale(1.08)}}

/* control panel */
.core{background:linear-gradient(180deg,rgba(32,40,84,.94),rgba(18,23,50,.94));border:1px solid #3a4785;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 20px rgba(0,0,0,.4);position:relative;overflow:hidden;padding-left:16px}
.core::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,var(--orange));box-shadow:0 0 12px var(--tc,var(--orange))}
.turnline{flex-wrap:wrap;column-gap:8px}
.turnline b{text-shadow:0 0 12px currentColor;white-space:nowrap}
.dicebox{flex-direction:row;gap:10px}
.dbtns{display:flex;flex-direction:column;gap:6px}
.dbtns .btn{padding:7px 12px}

/* 3D dice */
.die3d{--d:56px;width:var(--d);height:var(--d);perspective:420px;flex:0 0 auto}
.die3d .cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.15,.85,.3,1.05)}
.die3d .f{position:absolute;inset:0;border-radius:16%;background:radial-gradient(circle at 30% 25%,#fff 0,#eef0fa 45%,#c6cbe4 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 0 -3px 6px rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;backface-visibility:hidden}
.die3d .f i{width:74%;height:74%;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5a5f80,#0b0f21 70%)}
.die3d .f1 i{width:105%;height:105%;background:radial-gradient(circle at 35% 35%,#ff9a8a,#d61f1f 70%)}
.die3d .f1{transform:translateZ(calc(var(--d)/2))}
.die3d .f6{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.die3d .f2{transform:rotateY(90deg) translateZ(calc(var(--d)/2))}
.die3d .f5{transform:rotateY(-90deg) translateZ(calc(var(--d)/2))}
.die3d .f3{transform:rotateX(90deg) translateZ(calc(var(--d)/2))}
.die3d .f4{transform:rotateX(-90deg) translateZ(calc(var(--d)/2))}
.die3d.land{animation:dieland .3s}
@keyframes dieland{50%{transform:scale(1.18)}}
.dicerow .die3d{--d:50px}
.dnum{font-family:var(--f-display);font-size:32.2px;color:#ffd27a;min-width:1em;text-shadow:0 0 10px #f39a2e}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.duel>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 6px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 30%,transparent);transition:opacity .4s,filter .4s}
.duel>div.lose{opacity:.45;filter:grayscale(.8)}
.duel span{font-weight:700}.duel small{color:var(--muted)}
.dset{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dset .die3d{--d:40px}
.dsum{font-family:var(--f-display);font-size:29.9px;color:#ffd27a;min-height:1.1em;line-height:1.1;text-shadow:0 0 10px #f39a2e}
.dcount{text-align:center;font-family:var(--f-display);font-size:20.7px;margin:0}.dcount b{color:#ffd27a;font-size:29.9px}.dcount small{font-family:var(--f-body);font-size:13.8px;color:var(--muted)}
.duel .vs{font-family:var(--f-display);font-size:27.6px;color:#fff;text-shadow:0 0 10px var(--orange)}

/* player chips */
.pchip{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:8px 10px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-left:4px solid var(--c);border-radius:10px;position:relative;overflow:hidden}
.pchip.now{box-shadow:0 0 0 1px var(--c),0 0 16px color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,var(--panel2)),var(--panel2) 70%)}
.pchip.now::after{content:"TURN";position:absolute;right:8px;top:3px;font-family:var(--f-num);font-size:10.3px;letter-spacing:.2em;color:var(--c)}
.pchip .av{width:30px}.pchip .av svg{width:100%;height:auto;display:block}
.pinfo{display:flex;flex-direction:column;min-width:0}
.pchip .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .cash{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:700;font-size:17.2px;color:#ffd27a}
.coin{width:14px;height:14px;flex:0 0 auto}
.ptot{text-align:right;display:flex;flex-direction:column;align-items:flex-end;padding-top:8px}
.ptot b{font-family:var(--f-num);font-size:23px;line-height:1}
.ptot small{font-size:11.5px;color:var(--muted)}
.cps i{font-style:normal;color:#3a4270}.cps i.on{color:var(--orange);text-shadow:0 0 6px var(--orange)}
.cpu{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--muted);font-weight:400}

/* cards */
.card{position:relative;width:142px;padding:6px;border:0;border-radius:10px;gap:5px;background:linear-gradient(165deg,color-mix(in srgb,var(--ec) 34%,#182050) 0,#10153a 45%,#0c1030 100%);box-shadow:0 0 0 2px color-mix(in srgb,var(--ec) 75%,#000),0 0 0 3.5px rgba(255,255,255,.1),0 8px 16px rgba(0,0,0,.5)}
.hand{padding:6px 4px 10px}
.hand .card{transition:transform .2s}
.hand .card:hover{transform:translateY(-4px)}
.card .ctop{display:flex;align-items:center;gap:4px;min-width:0}
.card .el,.fname .el{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:12.6px;line-height:1;color:#fff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 45%),var(--ec);border:1.5px solid rgba(255,255,255,.75);text-shadow:0 1px 1px #000}
.card .cn{flex:1;min-width:0;font-family:var(--f-display);font-weight:400;font-size:13.8px;line-height:1.15;color:#fff;text-shadow:0 1px 0 #000;overflow-wrap:anywhere}
.card .cost{flex:0 0 auto;min-width:24px;height:20px;padding:0 4px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:12.6px;color:#3a2600;background:linear-gradient(180deg,#ffe28a,#f5b942);border:1px solid #8a6200}
.card .por{border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.15);margin:0}
.card .st{display:flex;gap:6px}
.card .st span{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:4px;padding:1px 0;font-size:14.9px}
.card .st svg{width:12px;height:12px}
.card .sa{background:rgba(255,90,90,.16);color:#ff9a9a}.card .sh{background:rgba(91,224,138,.14);color:#8ff0b0}
.card .st b{color:#fff}
.tag{background:rgba(0,0,0,.25)}
.card.rare{box-shadow:0 0 0 2px #f5d53b,0 0 0 3.5px rgba(255,255,255,.25),0 0 18px rgba(245,213,59,.35),0 8px 16px rgba(0,0,0,.5)}
.card.rare::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 44%,rgba(255,215,90,.22) 50%,rgba(120,200,255,.2) 56%,transparent 70%);background-size:300% 100%;animation:holo 3.2s linear infinite;mix-blend-mode:screen}
@keyframes holo{from{background-position:100% 0}to{background-position:-200% 0}}
.card.item{--ec:#7fb8ff}

/* sheets */
.sheet{background:radial-gradient(ellipse at 50% 100%,rgba(20,26,70,.6),rgba(3,5,14,.84))}
.sheet:not([hidden]) .sheet-card{animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(24px);opacity:0}}
.sheet-card{background:linear-gradient(180deg,#1d2452,#121735 45%);border:1px solid #3a4785;border-top:3px solid var(--orange);box-shadow:0 -10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);position:relative}
.sheet-card h2{display:flex;align-items:center;gap:8px}
.sheet-card h2::before{content:"";width:6px;height:1em;background:linear-gradient(var(--orange),var(--green));transform:skewX(-15deg);flex:0 0 auto}
.sheet.wild .sheet-card{background:radial-gradient(ellipse at 50% 30%,rgba(76,196,106,.32),transparent 60%),linear-gradient(180deg,#123020,#0b0f21 70%);border-top-color:var(--e-kusa)}
.sheet.wild .sheet-body>.card,.skillfx .card{width:190px;align-self:center;animation:appear .6s cubic-bezier(.2,.8,.2,1.2)}
.sheet-body>.card:first-child{margin-top:8px}.sheet-body>.card:last-child{margin-bottom:8px}
@keyframes appear{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.skillfx{display:flex;flex-direction:column;align-items:center;gap:10px}
.skillfx .big{font-family:var(--f-display);font-size:23px;text-align:center;color:#ffd27a;text-shadow:0 0 10px #e65fb0;margin:0}
.evart{border-radius:10px;overflow:hidden;height:120px;box-shadow:0 0 0 1px #3a4785}
.evart svg{width:100%;height:100%;display:block}
.trophy{width:150px;margin:0 auto;animation:appear .7s cubic-bezier(.2,.8,.2,1.2)}
.trophy svg{width:100%;display:block}
.sheet.win .sheet-card{border-top-color:#f5d53b;background:radial-gradient(ellipse at 50% 20%,rgba(245,213,59,.25),transparent 60%),linear-gradient(180deg,#2a2148,#121735 60%)}
.tbar{height:40px;background:linear-gradient(90deg,#141a3a,#1d2452,#141a3a);border:1px solid #3a4785;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border-radius:20px}
.tbar .good{background:linear-gradient(180deg,rgba(91,224,138,.45),rgba(63,174,106,.2))}
.tbar .perfect{background:linear-gradient(180deg,#ffd27a,#f39a2e);box-shadow:0 0 12px #f39a2e}
.tbar .mk{width:6px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff,0 0 20px #7fb8ff}
.grade{text-shadow:0 2px 0 #000}
.grade.p{color:#ffd27a;text-shadow:0 0 14px #f39a2e,0 2px 0 #000;animation:gradepop .4s}
@keyframes gradepop{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1)}}

/* battle stage */
.sheet.battle .sheet-card{width:min(672px,100%);border-top-color:#ff3b5c;background:radial-gradient(ellipse at 15% 25%,rgba(255,70,90,.28),transparent 55%),radial-gradient(ellipse at 85% 25%,rgba(70,130,255,.28),transparent 55%),linear-gradient(180deg,#1b1036,#0b0f21 70%)}
.sheet.battle .sheet-card h2{font-size:27.6px;color:#fff;text-shadow:0 0 12px #ff3b5c;font-style:italic}
.arena{position:relative;overflow:hidden;border-radius:12px;padding:10px 6px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.arena::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 3deg,transparent 3deg 10deg);animation:spinbg 30s linear infinite;pointer-events:none}
@keyframes spinbg{to{transform:rotate(360deg)}}
.fighter{z-index:1;align-items:center;text-align:center}
.fighter .who{font-family:var(--f-num);letter-spacing:.12em;font-size:11.5px;font-weight:700}
.fl .who{color:#ff8a9a}.fr .who{color:#8ab8ff}
.fport{width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--ec);box-shadow:0 0 20px color-mix(in srgb,var(--ec) 55%,transparent),0 6px 16px rgba(0,0,0,.6);background:#0e1329}
.fport .por{border-radius:0}
.fname{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:14.9px;justify-content:center;line-height:1.2}
.hpbar{position:relative;width:100%;height:10px;background:#0a0d1e;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.15);border-radius:5px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hpbar i.trail{background:#ff6b6b;transition:width .5s .45s}
.hpbar i.cur{background:linear-gradient(180deg,#9dffbf,#2fbf6a);transition:width .3s}
.hptext{font-family:var(--f-num);font-weight:700}
.arena .vs{font-size:34.5px;color:#fff;text-shadow:0 0 10px #ff3b5c,0 0 20px #ff3b5c,0 3px 0 #000;font-style:italic;z-index:1}
.fighter.lunge.fl .fport{animation:lungeR .42s ease-out}
.fighter.lunge.fr .fport{animation:lungeL .42s ease-out}
@keyframes lungeR{35%{transform:translateX(38%) scale(1.1) rotate(4deg)}}
@keyframes lungeL{35%{transform:translateX(-38%) scale(1.1) rotate(-4deg)}}
.fighter.hit .fport{animation:shake .45s,hitflash .45s}
@keyframes hitflash{0%{filter:brightness(2.6) saturate(.2)}100%{filter:none}}
.fighter.ko .fport{filter:grayscale(1) brightness(.5);transform:translateY(6px) rotate(-3deg);transition:filter .5s,transform .5s}
.burst{position:absolute;left:50%;top:34%;width:90%;transform:translate(-50%,-50%);pointer-events:none;animation:burst .5s ease-out forwards;z-index:3}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3) rotate(25deg);opacity:0}}
.sheet-card.quake{animation:quake .5s}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(-10px,4px)}30%{transform:translate(9px,-5px)}45%{transform:translate(-7px,3px)}60%{transform:translate(6px,-2px)}80%{transform:translate(-3px,1px)}}
.blog{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}

/* cut-in, floats, confetti */
#cutin{position:fixed;left:0;right:0;top:36%;z-index:40;pointer-events:none;opacity:0;overflow:hidden;padding:20px 0}
#cutin.go{animation:cutwrap 1.05s ease forwards}
#cutin .band{transform:skewY(-5deg);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 80%,#000) 12%,var(--c) 50%,color-mix(in srgb,var(--c) 80%,#000) 88%,transparent);padding:12px 0 10px;border-block:3px solid #fff;box-shadow:0 0 40px color-mix(in srgb,var(--c) 70%,transparent);text-align:center;position:relative;overflow:hidden}
#cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 26px);animation:lines .5s linear infinite}
@keyframes lines{to{transform:translateX(-28px)}}
#cutin b{position:relative;display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(29.9px,9.2vw,55.2px);line-height:1.15;color:#fff;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.5);letter-spacing:.06em;font-style:italic}
#cutin span{position:relative;display:block;font-family:var(--f-num);letter-spacing:.35em;font-size:13.8px;color:#fff;font-weight:700}
#cutin.go b{animation:cutx 1.05s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cutwrap{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes cutx{0%{transform:translateX(60vw)}22%{transform:translateX(0)}78%{transform:translateX(-2vw)}100%{transform:translateX(-70vw)}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.mfloat{position:fixed;transform:translate(-50%,0);font-family:var(--f-display);font-size:25.3px;animation:mfloat 2.6s ease-out forwards;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap}
.mfloat.up{color:#ffd27a}.mfloat.down{color:#ff6b6b}
@keyframes mfloat{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.coinp{position:fixed;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#f5c542 50%,#a87a00);border:1px solid #8a6200;animation:coinp .9s ease-out both}
@keyframes coinp{0%{transform:translate(0,0);opacity:1}60%{transform:translate(calc(var(--dx)*.8),-50px)}100%{transform:translate(var(--dx),-10px);opacity:0}}
.confetti{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;animation:conf linear both;will-change:transform}
@keyframes conf{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#cutin{display:none}.piece{transition:none}.die3d .cube{transition:none}}

.hud{position:absolute;left:6px;right:6px;top:6px;z-index:4;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.hc{display:inline-flex;align-items:center;gap:3px;max-width:48%;padding:2px 7px 2px 4px;border-radius:999px;background:rgba(8,10,26,.82);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);font-size:12.6px;line-height:1.3;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.hc.now{box-shadow:0 0 0 1px var(--c),0 0 8px var(--c)}
.hc>i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.hc .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:6em;color:#dfe3ff}
.hc .coin{width:11px;height:11px}
.hc b{font-family:var(--f-num);color:#ffd27a}
.viewport{margin-bottom:-2px}

.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;overflow:visible;padding:4px 3px 6px}
@media (min-width:640px){.hand{grid-template-columns:repeat(6,minmax(0,1fr))}}
.hand .card{width:auto;padding:5px;gap:4px}
.hand .card .cn{font-size:12.6px}
.hand .card .nt{font-size:11.5px;line-height:1.3}
.hand .card .tags .tag{font-size:10.3px;padding:0 3px}
.hand .card .st span{font-size:13.8px}
.hand .card .cost{min-width:20px;height:18px;font-size:11.5px}
.hand .card .el{width:18px;height:18px;font-size:11.5px}
/* ===== characters, speech, special moves (v7) ===== */
.face{display:block;width:100%;height:100%}
.pchip .av.isface{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 50%,transparent)}
.setface{display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--c);margin-bottom:4px}
.prow>b{display:flex;flex-direction:column;align-items:center}
.hface{display:grid;place-items:center;width:100%;height:100%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,#141a35),#0b0f21)}
.hface svg{width:62%;height:auto}
#cutin .band{display:flex;align-items:center;justify-content:center;gap:12px}
#cutin .ctx{position:relative}
#cutin .cface{display:none;position:relative;width:clamp(56px,16vw,84px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 16px rgba(0,0,0,.6);flex:0 0 auto}
#cutin.hasface .cface{display:block}
#cutin.go .cface{animation:cutx 1.05s cubic-bezier(.2,.8,.2,1) forwards}
/* VS screen */
#vsscr{position:fixed;inset:0;z-index:47;pointer-events:none;display:none;overflow:hidden}
#vsscr.go{display:block}
#vsscr .vh{position:absolute;top:0;bottom:0;width:62%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 9%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 3px,transparent 3px 22px),linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#000),color-mix(in srgb,var(--e) 45%,#05070f))}
#vsscr .vh.l{left:0;clip-path:polygon(0 0,100% 0,62% 100%,0 100%);animation:vsl 1.6s cubic-bezier(.2,.8,.2,1) both;padding-right:22%}
#vsscr .vh.r{right:0;clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);animation:vsr 1.6s cubic-bezier(.2,.8,.2,1) both;padding-left:22%}
#vsscr .vface{width:clamp(64px,20vw,110px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 20px rgba(0,0,0,.6)}
#vsscr .vmon{width:clamp(120px,36vw,220px);border-radius:10px;overflow:hidden;border:2px solid var(--e);box-shadow:0 0 24px var(--e)}
#vsscr .vmon .por{display:block}
#vsscr b{font-family:var(--f-display);font-weight:400;font-size:clamp(18.4px,5.3vw,29.9px);color:#fff;text-shadow:0 2px 0 #000}
#vsscr small{color:#fff;opacity:.85;font-weight:700}
#vsscr .vvs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(64.4px,20.7vw,138px);font-style:italic;color:#fff;text-shadow:0 0 20px #ff3b5c,0 0 40px #ff3b5c,0 6px 0 #000;animation:vsv 1.6s ease both}
@keyframes vsl{0%{transform:translateX(-100%)}18%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(-30%);opacity:0}}
@keyframes vsr{0%{transform:translateX(100%)}18%{transform:translateX(0)}82%{transform:translateX(0);opacity:1}100%{transform:translateX(30%);opacity:0}}
@keyframes vsv{0%,15%{transform:translate(-50%,-50%) scale(3);opacity:0}30%{transform:translate(-50%,-50%) scale(1);opacity:1}82%{opacity:1}100%{opacity:0}}
/* speech bubbles */
#talk{position:fixed;inset:0;z-index:49;display:none;place-items:center;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
#talk.go{display:grid}
#talk .tbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 45%,transparent),rgba(4,6,18,.82) 70%);animation:tbg .35s ease both}
#talk .tlines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0 1.2deg,transparent 1.2deg 7deg);animation:spinbg 9s linear infinite,tbg .35s ease both}
#talk .tk{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;width:min(92vw,560px)}
#talk .tface{position:relative;z-index:2;width:clamp(110px,32vw,170px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid #fff;outline:4px solid var(--c);box-shadow:0 0 30px var(--c),0 0 60px color-mix(in srgb,var(--c) 60%,transparent),0 8px 20px rgba(0,0,0,.7);background:#0b0f21}
#talk .tk.l .tface{align-self:flex-start;margin-left:4%;animation:tfl .45s cubic-bezier(.2,.9,.2,1.2) both}
#talk .tk.r .tface{align-self:flex-end;margin-right:4%;animation:tfr .45s cubic-bezier(.2,.9,.2,1.2) both}
#talk .tb{position:relative;margin-top:-26px;width:100%;box-sizing:border-box;background:#fff;color:#11152b;padding:30px 22px 20px;clip-path:polygon(0 8%,6% 0,30% 5%,52% 0,74% 4%,96% 0,100% 12%,98% 50%,100% 88%,94% 100%,70% 95%,48% 100%,26% 96%,4% 100%,0 86%,2% 50%);filter:drop-shadow(0 0 0 #000);box-shadow:inset 0 0 0 5px var(--c);animation:tbp .5s cubic-bezier(.2,.9,.3,1.3) .12s both,tshake .35s ease .5s}
#talk .tb small{display:inline-block;font-size:clamp(14px,3.8vw,18px);font-weight:900;color:#fff;background:var(--c);padding:2px 12px;border-radius:999px;margin-bottom:8px;text-shadow:0 1px 0 #000}
#talk .tb b{display:block;font-family:var(--f-display);font-weight:400;font-style:italic;font-size:clamp(24px,7.2vw,42px);line-height:1.25;text-align:center;letter-spacing:.02em;color:#11152b;text-shadow:3px 3px 0 color-mix(in srgb,var(--c) 45%,#fff)}
#talk .thint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;opacity:.75;font-size:14px;font-weight:700;animation:thint 1.2s ease-in-out infinite}
@keyframes tbg{from{opacity:0}to{opacity:1}}
@keyframes tfl{0%{transform:translateX(-120vw) rotate(-20deg)}100%{transform:none}}
@keyframes tfr{0%{transform:translateX(120vw) rotate(20deg)}100%{transform:none}}
@keyframes tbp{0%{opacity:0;transform:scale(.2) rotate(-6deg)}70%{opacity:1;transform:scale(1.08) rotate(1deg)}100%{transform:none}}
@keyframes tshake{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes thint{0%,100%{opacity:.35}50%{opacity:.9}}
/* big text burst */
#bigfx{position:fixed;left:50%;top:42%;width:min(110vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:48;pointer-events:none;display:none;place-items:center}
#bigfx.go{display:grid;animation:bigfx 1s ease-out both}
#bigfx svg{position:absolute;inset:0;width:100%;height:100%;animation:spinbg 6s linear infinite}
#bigfx b{position:relative;font-family:var(--f-display);font-weight:400;font-style:italic;font-size:clamp(41.4px,13.8vw,82.8px);color:#fff;-webkit-text-stroke:2px var(--c);text-shadow:0 0 18px var(--c),0 5px 0 #000;white-space:nowrap}
@keyframes bigfx{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(.95)}26%{transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
/* special move */
#special{position:fixed;inset:0;z-index:48;pointer-events:none;display:none;overflow:hidden}
#special.go{display:block;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 30%,transparent),rgba(0,0,0,.85));animation:spbg 1.9s ease both}
#special::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 45%,transparent) 0 2deg,transparent 2deg 9deg);animation:spinbg 4s linear infinite;opacity:.5}
#special .sp1{position:absolute;left:0;right:0;top:18%;display:flex;align-items:center;gap:14px;padding:10px 6%;transform:skewY(-6deg);background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 85%,#000),var(--pc) 60%,transparent);border-block:3px solid #fff;animation:sp1 1.9s cubic-bezier(.2,.8,.2,1) both}
#special .sface{width:clamp(80px,24vw,130px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #fff;flex:0 0 auto;box-shadow:0 0 20px rgba(0,0,0,.6)}
#special .sshout{font-family:var(--f-display);font-size:clamp(25.3px,7.5vw,46px);color:#fff;text-shadow:0 3px 0 #000;font-style:italic}
#special .sp2{position:absolute;left:0;right:0;top:42%;display:flex;flex-direction:column;align-items:center;gap:8px;animation:sp2 1.9s cubic-bezier(.2,.8,.2,1) both}
#special .spor{width:min(clamp(180px,60vw,340px),34vh);border-radius:12px;overflow:hidden;border:3px solid var(--c);box-shadow:0 0 40px var(--c),0 0 80px var(--c)}
#special .spor .por{display:block}
#special .stx{text-align:center}
#special .eps,.learn .eps{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ep{position:absolute;left:var(--x);top:var(--y);width:calc(26px*var(--s));height:calc(26px*var(--s));opacity:0;animation:epFall var(--du) var(--dl) ease-in infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
#special.e-honoo .ep{animation-name:epRise}#special.e-kaze .ep{animation-name:epSweep}#special.e-denki .ep{animation-name:epZap}#special.e-kusa .ep{animation-name:epLeaf}
@keyframes epFall{0%{opacity:0;transform:translateY(-40vh) rotate(var(--r))}15%{opacity:1}100%{opacity:0;transform:translateY(40vh) rotate(calc(var(--r) + 90deg))}}
@keyframes epRise{0%{opacity:0;transform:translateY(40vh) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-40vh) scale(1.3)}}
@keyframes epSweep{0%{opacity:0;transform:translateX(-50vw) rotate(var(--r))}20%{opacity:1}100%{opacity:0;transform:translateX(50vw) rotate(calc(var(--r) + 200deg))}}
@keyframes epZap{0%,100%{opacity:0;transform:scale(.4) rotate(var(--r))}10%,30%{opacity:1;transform:scale(1.3) rotate(var(--r))}20%{opacity:.2}}
@keyframes epLeaf{0%{opacity:0;transform:translate(-10vw,-40vh) rotate(var(--r))}15%{opacity:1}100%{opacity:0;transform:translate(10vw,40vh) rotate(calc(var(--r) + 360deg))}}
#special.big.go{animation-duration:2.7s}#special.big .sp1,#special.big .sp2{animation-duration:2.7s}
#special.big::before{opacity:.75;animation-duration:1.6s}
#special.big .stx small{color:#c08a1e;font-size:15px}
#special.big .stx b{font-size:clamp(40px,13vw,84px);animation:bigPulse .5s ease-in-out infinite alternate}
#special.big .spor{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c),0 0 60px var(--c)}
@keyframes bigPulse{to{transform:scale(1.06)}}
#special .stx small{display:block;font-family:var(--f-num);letter-spacing:.4em;color:#fff;font-weight:700}
#special .stx b{display:block;font-family:var(--f-display);font-weight:400;font-style:italic;font-size:clamp(34.5px,11.5vw,69px);color:#fff;-webkit-text-stroke:2px var(--c);text-shadow:0 0 20px var(--c),0 5px 0 #000;line-height:1.1}
@keyframes spbg{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes sp1{0%{transform:skewY(-6deg) translateX(-100%)}12%{transform:skewY(-6deg) translateX(0)}45%{transform:skewY(-6deg) translateX(0);opacity:1}55%{transform:skewY(-6deg) translateX(100%);opacity:0}100%{opacity:0}}
@keyframes sp2{0%,42%{opacity:0;transform:translateX(120%) scale(.8)}55%{opacity:1;transform:translateX(0) scale(1.08)}62%{transform:scale(1)}88%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:translateX(-60%) scale(1.2)}}
@media (prefers-reduced-motion:reduce){#vsscr,#special,#bigfx{display:none!important}#talk *{animation:none!important}}

.tbar .sweet{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#fff,#ff4b8a);box-shadow:0 0 10px #ff4b8a,0 0 18px #ff4b8a;animation:sweet .6s ease-in-out infinite alternate}
@keyframes sweet{to{box-shadow:0 0 4px #ff4b8a}}
.ttag{display:inline-block;font-size:12.6px;font-weight:700;border-radius:999px;padding:0 8px;background:#2b3668;color:#dfe3ff;margin-left:4px}
.ttag.acc{background:#e65fb0;color:#fff;animation:sweet .5s ease-in-out infinite alternate}
.grade.s{color:#ff4b8a;text-shadow:0 0 14px #ff4b8a,0 2px 0 #000;animation:gradepop .4s}
#cutin b{white-space:nowrap}
#cutin.hasface b{font-size:clamp(23px,6.9vw,50.6px)}
#vsscr .vh{width:100%;height:100%;padding:0;gap:4px}
#vsscr .vh.l{clip-path:polygon(0 0,100% 0,100% 40%,0 60%);justify-content:flex-start;padding-top:6vh;padding-right:0}
#vsscr .vh.r{clip-path:polygon(0 60%,100% 40%,100% 100%,0 100%);justify-content:flex-end;padding-bottom:6vh;padding-left:0}
#vsscr .vface{width:clamp(56px,13vmin,100px)}
#vsscr .vmon{width:clamp(110px,30vmin,220px)}

.hero{background:#0d0a2e;border:1px solid #4a2a7a;box-shadow:0 0 30px rgba(184,48,110,.35)}
.keyart{display:block;width:100%;height:auto}
.keyart .tw{animation:twinkle 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
.keyart .krays{transform-box:view-box;transform-origin:200px 168px;animation:spinbg 60s linear infinite}
.keyart .ktrain{animation:ktrain 45s linear infinite}
@keyframes ktrain{0%{transform:translateX(-120px)}20%,100%{transform:translateX(520px)}}
.rb{margin-top:2px;font-size:19.5px;padding:8px 18px;animation:rbp .8s ease-in-out infinite alternate}

.dtimer{position:relative;height:22px;border-radius:11px;background:#0a0d1e;border:1px solid #3a4785;overflow:hidden;margin-top:8px}
.dtimer i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4b3a,#f5d53b 40%,#5be08a)}
.dtimer span{position:relative;display:block;text-align:center;font-weight:700;font-size:14.9px;line-height:22px;text-shadow:0 1px 2px #000}

/* compact setup screen */
.setup{gap:8px}
.setup .keyart{aspect-ratio:400/255;height:auto}
.setopts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;justify-content:flex-start;width:100%;text-align:left}
.setopts>div{flex:0 0 auto}

.setopts .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.setopts{gap:6px 8px;flex-wrap:nowrap;justify-content:space-between!important}
.setopts .seg button small{font-size:12.7px;opacity:.75;margin-left:3px}

.prow .fields input{width:100%;min-width:0;box-sizing:border-box}

.setface{width:32px;height:32px}
.howto{background:var(--panel2);border-radius:6px;padding:6px 10px}

.howto .note{margin:4px 0}

/* ===== chic theme: soft, airy, dusty-pastel look for young adult women (overrides everything above) ===== */
:root{
  --bg:#f7f1ea; --panel:#fffdfa; --panel2:#f4ece4; --line:#e6d9cc; --text:#4b4453; --muted:#9b9099;
  --orange:#e0907a; --green:#93b5a0; --ink:#4b4453; --gold:#b98a3a;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Quicksand","Zen Maru Gothic",ui-rounded,sans-serif;
  --e-honoo:#e98a6f; --e-kusa:#86b98a; --e-tsuchi:#c9a77a; --e-kaze:#7cbfbb; --e-denki:#dcb54e; --e-mizu:#7ea9d9;
  --p0:#e2878b; --p1:#6fa894; --p2:#8396d0; --p3:#cf9d45;
  --good:#7fbf95; --bad:#dc7676;
  color-scheme:light;
}
body{background-color:var(--bg);color:var(--text);
  background-image:radial-gradient(520px 360px at 6% -4%,#f6dcdc 0,transparent 70%),radial-gradient(520px 400px at 104% 26%,#e1ebdc 0,transparent 70%),radial-gradient(600px 420px at 40% 108%,#e7e1f1 0,transparent 70%),radial-gradient(#e6d8ca 1px,transparent 1.3px);
  background-size:auto,auto,auto,20px 20px}
h2,.logo,.turnline b,#cutin b,#vsscr b,#vsscr .vvs,#bigfx b,#special .stx b,#special .sshout,#talk .tb b,.grade,.dnum,.dsum,.dcount,.card .cn,.fname,.arena .vs,.duel .vs,.mfloat,.dmg,.skillfx .big,.sheet-card h2{font-weight:900!important;font-style:normal!important;letter-spacing:.02em}
.logo{gap:8px;align-items:center}
.logo .stripe{width:12px;height:12px;border-radius:50%;transform:none;background:var(--orange);box-shadow:9px 5px 0 -2px var(--green)}
.logo .word{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);filter:none;font-style:normal;margin-left:6px}
.logo small{font-family:var(--f-num);letter-spacing:.3em;color:var(--orange);font-weight:700}
/* buttons */
.btn{background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 0 #ece1d6;color:var(--ink)}
.btn:hover{border-color:var(--orange)}
.btn.ghost{background:rgba(255,255,255,.6)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;text-shadow:none;box-shadow:0 3px 0 #c27460}
.btn.skill{background:#bfa0c6;border-color:#bfa0c6;color:#fff;box-shadow:0 3px 0 #9a7aa2}
.btn.primary:active:not(:disabled),.btn.skill:active:not(:disabled){box-shadow:0 1px 0 #c27460}
.btn.opt{background:#fff;border-color:var(--line)}
.btn.opt:hover:not(:disabled){border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.btn:focus-visible,.tile:focus-visible,.seg button:focus-visible{outline-color:var(--orange)}
/* board */
.viewport{background:#f1e8de;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(120,90,70,.10)}
.mapart{box-shadow:none;border-radius:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 0 #e9ddd0}
.tile::before{background:linear-gradient(180deg,rgba(255,253,250,.92) 0,rgba(255,253,250,0) 32%,rgba(255,253,250,0) 70%,rgba(255,253,250,.9) 100%)}
.tile .nm{color:var(--ink);text-shadow:none}
.tile .ft{color:var(--ink);text-shadow:none}
.tile .ft .lv{color:var(--gold)}
.tile .ft .x2{color:var(--bad)}
.tile.owned{border:2px solid var(--oc);box-shadow:0 0 0 2px color-mix(in srgb,var(--oc) 22%,transparent)}
.tile.cp::after{color:var(--orange);text-shadow:0 0 3px #fff}
.tile.here{box-shadow:0 0 0 2px var(--orange) inset,0 0 0 4px rgba(224,144,122,.25)}
@keyframes here{50%{box-shadow:0 0 0 2px var(--orange) inset,0 0 0 6px rgba(224,144,122,.15)}}
.tile .badge{box-shadow:0 1px 2px rgba(75,68,83,.3);text-shadow:none;border-color:#fff}
@keyframes boost{50%{box-shadow:0 0 0 3px rgba(220,118,118,.4)}}
.board.zoom .tile .tok i{border-color:#fff;box-shadow:0 1px 3px rgba(75,68,83,.4)}
.piece svg{filter:drop-shadow(0 2px 2px rgba(75,68,83,.35))}
.mapbtn{background:rgba(255,255,255,.92)}
.hc{background:rgba(255,253,250,.94);box-shadow:0 1px 4px rgba(75,68,83,.12)}
.hc.now{box-shadow:0 0 0 1.5px var(--c)}
.hc .hn{color:var(--ink)}
.hc b{color:var(--gold)}
/* panel + players */
.core{background:#fffdfa;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(120,90,70,.08)}
.core::before{width:4px;box-shadow:none;border-radius:0 4px 4px 0}
.turnline b{text-shadow:none}
.log div:last-child{color:var(--ink)}
.pchip{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,#fffdfa),#fffdfa 58%);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:14px;box-shadow:0 2px 8px rgba(120,90,70,.06)}
.pchip.now{background:#fff;box-shadow:0 0 0 2px var(--c),0 6px 16px rgba(120,90,70,.10)}
.pchip .cash{color:var(--gold)}
.cps i{color:#e6d9cc}.cps i.on{color:var(--orange);text-shadow:none}
.cpu{border-color:var(--line)}
.pchip .av.isface{box-shadow:none;border-width:2px}
/* cards */
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--ec) 20%,#fff) 0,#fffdfa 42%);box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(120,90,70,.08);border-radius:14px}
.card .cn{color:var(--ink);text-shadow:none}
.card .por{box-shadow:none;border-radius:10px}
.card .el,.fname .el{text-shadow:none;border-color:#fff;box-shadow:0 1px 2px rgba(75,68,83,.25)}
.card .cost{background:#f6e6c4;border:0;color:#8a6a2a}
.card .sa{background:#fbe7e3;color:#c4615a}.card .sh{background:#e6f1e8;color:#5f9a72}
.card .st b{color:var(--ink)}
.tag{background:#f7f0e9;border-color:var(--line);color:var(--muted)}
.card.rare{box-shadow:0 0 0 2px #e4c56e,0 6px 16px rgba(200,160,70,.2)}
.card.rare::after{border-radius:14px;opacity:.6}
.card.item{--ec:#a9b8dc}
.por{background:#fff8f1}
/* sheets */
.sheet{background:rgba(75,68,83,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-card{background:#fffdfa;border:0;border-top:0;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(75,68,83,.18)}
@media (min-width:640px){.sheet-card{border-radius:24px}}
.sheet-card h2{color:var(--ink)}
.sheet-card h2::before{width:10px;height:10px;border-radius:50%;transform:none;background:var(--orange);box-shadow:7px 4px 0 -2px var(--green)}
.sheet.wild .sheet-card{background:radial-gradient(ellipse at 50% 0,#e4efe0 0,#fffdfa 62%)}
.sheet.win .sheet-card{background:radial-gradient(ellipse at 50% 0,#f8ebcc 0,#fffdfa 62%)}
.sheet.battle .sheet-card{background:radial-gradient(ellipse at 15% 0,#fbe3df 0,transparent 55%),radial-gradient(ellipse at 85% 0,#e1e8f6 0,transparent 55%),#fffdfa}
.sheet.battle .sheet-card h2{color:var(--ink);text-shadow:none;font-size:25px}
.arena{background:#fff8f3;box-shadow:inset 0 0 0 1px var(--line)}
.arena::before{background:repeating-conic-gradient(from 0deg,rgba(224,144,122,.05) 0 3deg,transparent 3deg 10deg)}
.fl .who{color:#d0767b}.fr .who{color:#7086c4}
.fighter .who{font-size:14.4px!important;font-weight:900!important;letter-spacing:.06em!important;line-height:1.3}
.fighter .hptext{font-size:15.9px!important;font-weight:900!important}
.core .turnline{justify-content:flex-start!important;column-gap:18px!important}
.core .dicebox{gap:20px!important}
.opt small.etag>span{display:inline-block;min-width:3em;text-align:left}
.fighter .bonus{font-size:14.5px!important;font-weight:800!important;line-height:1.4}
.fport{background:#fff;box-shadow:0 6px 16px rgba(120,90,70,.12)}
.hpbar{background:#f1e7dd;border:0;box-shadow:none}
.hpbar i.trail{background:#efb3ae}
.hpbar i.cur{background:linear-gradient(180deg,#a9dbb8,#7fbf95)}
.arena .vs,.duel .vs{color:var(--orange);text-shadow:none}
.blog{background:#f8f1ea;border:0}
.blog .hit{color:#c4615a}
.skillfx .big{color:#b0709e;text-shadow:none}
.evart{box-shadow:0 0 0 1px var(--line)}
/* timing + dice */
.tbar{background:#f4ece4;border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(120,90,70,.12)}
.tbar .good{background:rgba(147,181,160,.45)}
.tbar .perfect{background:linear-gradient(180deg,#f6cdb6,#e9a98c);box-shadow:none}
.tbar .sweet{background:linear-gradient(180deg,#fff,#e58fb0);box-shadow:0 0 6px #e58fb0}
@keyframes sweet{to{box-shadow:0 0 2px #e58fb0}}
.tbar .mk{background:var(--ink);box-shadow:0 0 0 2px #fff}
.grade{text-shadow:none}
.grade.p{color:var(--orange);text-shadow:none}.grade.g{color:#6fa784}.grade.s{color:#d36f93;text-shadow:none}
.ttag{background:#efe5dc;color:var(--ink)}.ttag.acc{background:#e58fb0;color:#fff}
.die3d .f{background:radial-gradient(circle at 30% 25%,#fff 0,#fbf6f0 50%,#e9ddd1 100%);box-shadow:inset 0 0 0 1px rgba(120,90,70,.15)}
.die3d .f i{background:radial-gradient(circle at 35% 35%,#7a7085,#4b4453 70%)}
.die3d .f1 i{background:radial-gradient(circle at 35% 35%,#f5b7a6,#e0907a 70%)}
.dnum,.dsum{color:var(--orange);text-shadow:none}
.dcount b{color:var(--orange)}
.duel>div{background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:none}
.dtimer{background:#f4ece4;border-color:var(--line)}
.dtimer i{background:linear-gradient(90deg,#efb3ae,#f2d79a 45%,#a9dbb8)}
.dtimer span{text-shadow:none;color:var(--ink)}
@keyframes rbp{to{transform:scale(1.05);box-shadow:0 3px 0 #c27460,0 0 0 6px rgba(224,144,122,.2)}}
/* setup */
.hero{background:#fffaf4;border:1px solid var(--line);box-shadow:none;border-radius:18px}
.hero .stripe2{display:none}
.seg{background:#fff;border-color:var(--line);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.prow{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px}
.prow input,.prow select{background:#fbf7f2;border-color:var(--line);border-radius:8px}
.howto{background:#fff;border:1px solid var(--line);border-radius:14px}
.rank div{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c)}
/* cut-in */
#cutin .band{transform:skewY(-3deg);background:linear-gradient(90deg,transparent,rgba(255,253,250,.96) 10%,#fffdfa 50%,rgba(255,253,250,.96) 90%,transparent);border-block:2px solid var(--c);box-shadow:0 10px 30px rgba(75,68,83,.15)}
#cutin .band::before{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent) 0 2px,transparent 2px 26px)}
#cutin b{color:var(--ink);text-shadow:none}
#cutin span{color:var(--c)}
#cutin .cface{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
/* VS */
#vsscr .vh{background:radial-gradient(color-mix(in srgb,var(--c) 30%,transparent) 1.5px,transparent 2px) 0 0/18px 18px,linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,#fff),color-mix(in srgb,var(--c) 14%,#fffdfa))}
#vsscr b{color:var(--ink);text-shadow:none}
#vsscr small{color:var(--muted)}
#vsscr .vvs{color:var(--orange);text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 10px 30px rgba(75,68,83,.25)}
#vsscr .vface{border-color:#fff;box-shadow:0 6px 18px rgba(75,68,83,.2)}
#vsscr .vmon{box-shadow:0 6px 18px rgba(75,68,83,.2)}
/* speech */
#talk .tbg{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 28%,#fffdfa),rgba(247,241,234,.96) 72%)}
#talk .tlines{inset:0;background:radial-gradient(color-mix(in srgb,var(--c) 35%,transparent) 1.6px,transparent 2px) 0 0/22px 22px;animation:tbg .35s ease both}
#talk .tface{border:4px solid #fff;outline:2px solid var(--c);box-shadow:0 8px 24px rgba(75,68,83,.18)}
#talk .tb{clip-path:none;border-radius:26px;background:#fff;box-shadow:0 0 0 2px var(--c),0 12px 32px rgba(75,68,83,.15)}
#talk .tb small{text-shadow:none}
#talk .tb b{color:var(--ink);text-shadow:none;font-size:clamp(20px,6vw,34px)}
#talk .thint{color:var(--muted)}
/* bursts, special move, floats */
#bigfx b{color:var(--c);-webkit-text-stroke:0;text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 10px 26px rgba(75,68,83,.22)}
#special.go{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 26%,#fffdfa),rgba(247,241,234,.96))}
#special::before{opacity:.22}
#special .sp1{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 35%,#fff),#fffdfa 60%,transparent);border-block:2px solid var(--pc)}
#special .sface{border-color:#fff;box-shadow:0 6px 18px rgba(75,68,83,.2)}
#special .sshout{color:var(--ink);text-shadow:none}
#special .spor{box-shadow:0 0 0 3px #fff,0 12px 30px rgba(75,68,83,.22)}
#special .stx small{color:var(--muted)}
#special .stx b{color:var(--c);-webkit-text-stroke:0;text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff}
.mfloat{text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
.mfloat.up{color:var(--gold)}.mfloat.down{color:var(--bad)}
.dmg{color:var(--orange);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
.dmg.crit{color:#d36f93}
.lrow{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.lthumb{flex:0 0 auto;width:56px;height:42px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.lthumb svg{width:100%;height:100%;display:block}
.ltxt{display:flex;flex-direction:column;min-width:0}
.ltxt b{font-weight:700}
.ltxt small{color:var(--muted);font-size:12.6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lel{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ec);color:#fff;font-size:10px;font-family:var(--f-display)}
.llv{color:var(--gold)}

/* 足元の読みやすさ: 白い小判の上に濃い文字 */
.tile .ft{padding:0 3px 3px;font-size:clamp(8.5px,1.5vw,12px);font-weight:700}
.tile .ft>span:not(:empty){display:inline-flex;align-items:center;gap:1px;background:rgba(255,253,249,.94);color:var(--ink);border-radius:999px;padding:1px 6px 1px 4px;box-shadow:0 1px 3px rgba(60,40,30,.22),0 0 0 1px rgba(60,40,30,.08);line-height:1.35;text-shadow:none}
.tile .ft>span:last-child:not(:empty){padding:1px 6px;font-size:1.08em}
.tile .ft .lv{color:#d49a2a;letter-spacing:-.05em;margin-left:2px}
.tile .ft svg{color:var(--ink)}
.tile.has-mon .nm{align-self:flex-start;max-width:calc(100% - 14px);margin:2px 0 0 2px;padding:1px 6px;background:rgba(255,253,249,.94);border-radius:999px;box-shadow:0 1px 3px rgba(60,40,30,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}

/* 引いたカード */
.drawn{margin-top:8px;text-align:center}
.drawn>small{display:block;color:var(--muted);font-size:12.6px;margin-bottom:6px;letter-spacing:.1em}
.drawrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dcard{animation:dealIn .55s cubic-bezier(.2,1.4,.4,1) var(--d) both}
.dcard .card{width:118px}
.cback{width:96px;height:132px;border-radius:14px;background:repeating-linear-gradient(45deg,#f6dcd8 0 8px,#fbeee9 8px 16px);box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(120,90,70,.1);display:grid;place-items:center}
.cback span{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:#e0907a;font-size:20px}
@keyframes dealIn{0%{opacity:0;transform:translateY(-40px) rotateY(90deg) scale(.7)}60%{opacity:1;transform:translateY(4px) rotateY(0) scale(1.05)}100%{opacity:1;transform:none}}
.drawtoast{position:fixed;right:16px;bottom:18%;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;animation:toastIn 2.6s ease both}
.drawtoast small{background:#fff;border-radius:999px;padding:3px 12px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px rgba(60,40,30,.15);font-size:13px}
.drawtoast .card{width:116px}
@keyframes toastIn{0%{opacity:0;transform:translateY(-30px) rotate(-8deg) scale(.7)}14%{opacity:1;transform:translateY(0) rotate(2deg) scale(1.04)}22%{transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translate(-30vw,40vh) scale(.3) rotate(-10deg)}}
/* バトルのどうぐ演出 */
.ifx{position:absolute;inset:0;z-index:6;pointer-events:none;display:grid;place-items:center}
.ifx>*{grid-area:1/1}
.icard{width:62%;max-width:120px;background:#fffdfa;border-radius:14px;padding:6px;box-shadow:0 0 0 2px var(--line),0 10px 24px rgba(60,40,30,.25);display:flex;flex-direction:column;align-items:center;gap:3px;animation:icIn 1.7s ease both}
.icard svg{width:100%;height:auto;border-radius:10px}
.icard b{font-size:12.5px}
@keyframes icIn{0%{opacity:0;transform:translateY(-70px) rotate(-14deg) scale(.5)}18%{opacity:1;transform:translateY(0) rotate(3deg) scale(1.1)}28%{transform:scale(1)}48%{opacity:1;transform:scale(1)}62%{opacity:0;transform:scale(.3) translateY(30px)}100%{opacity:0}}
.ifx.jammed .icard{animation:icJam 1.7s ease both}
@keyframes icJam{0%{opacity:0;transform:translateY(-70px) rotate(-14deg) scale(.5)}18%{opacity:1;transform:none}40%{opacity:1;filter:none;transform:none}55%{filter:grayscale(1) brightness(.8);transform:rotate(-6deg) translateX(-4px)}62%{transform:rotate(6deg) translateX(4px)}70%{opacity:1;filter:grayscale(1);transform:rotate(-3deg)}100%{opacity:0;filter:grayscale(1);transform:translateY(40px) rotate(-20deg) scale(.7)}}
.ieff{width:92%;max-width:180px;overflow:visible;opacity:0;animation:ieIn 1.1s ease .55s both}
@keyframes ieIn{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.08)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.islash{stroke-dasharray:100;stroke-dashoffset:100;animation:dash .35s ease-out .6s forwards}
.iring{animation:ringPulse .9s ease-out .6s both}
@keyframes ringPulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.3);opacity:0}}
.iup{animation:rise .8s ease-out both}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}40%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.ishield{stroke-dasharray:260;stroke-dashoffset:260;animation:dash .6s ease-out .6s forwards}
.iplus{animation:plusPop .5s cubic-bezier(.2,1.6,.4,1) .85s both}
@keyframes plusPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.iwave{animation:ringPulse .9s ease-out both}
.ix{stroke-dasharray:90;stroke-dashoffset:90;animation:dash .3s ease-out .9s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.ipop{align-self:end;margin-bottom:18%;background:#fff;border-radius:999px;padding:4px 14px;font-family:var(--f-display);font-weight:900;font-size:17px;color:#e0907a;box-shadow:0 4px 12px rgba(60,40,30,.2);animation:popUp 1.2s cubic-bezier(.2,1.4,.4,1) .7s both;white-space:nowrap}
.ifx.k-hp .ipop{color:#5f9a7a}.ifx.k-jam .ipop{color:#9a7ab8}.ipop.bad{color:#d9707b!important}
@keyframes popUp{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1.12)}40%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.fighter.pw .fport{animation:powerGlow 1.6s ease .6s}
@keyframes powerGlow{0%,100%{box-shadow:0 0 0 2px var(--ec)}30%{box-shadow:0 0 0 4px #e8c56e,0 0 30px 10px rgba(240,160,140,.85);transform:scale(1.04)}60%{box-shadow:0 0 0 3px #e0907a,0 0 18px 6px rgba(240,160,140,.6)}}
.fighter.sh .fport{animation:shieldGlow 1.6s ease .6s}
@keyframes shieldGlow{0%,100%{box-shadow:0 0 0 2px var(--ec)}30%{box-shadow:0 0 0 4px #8fa8d4,0 0 28px 10px rgba(143,168,212,.8)}60%{box-shadow:0 0 0 3px #cfe3f1,0 0 16px 6px rgba(143,168,212,.5)}}
.hpbar.grow{animation:hpGrow 1.2s ease .8s}
@keyframes hpGrow{0%,100%{filter:none;transform:none}35%{filter:brightness(1.3) drop-shadow(0 0 6px #93b5a0);transform:scaleY(1.6)}}
.fighter.static .fport{animation:staticFx 1.2s steps(2) .7s}
@keyframes staticFx{0%,100%{filter:none;transform:none}20%{filter:hue-rotate(90deg) contrast(1.6);transform:translateX(-3px) skewX(4deg)}40%{filter:grayscale(1) contrast(2);transform:translateX(3px) skewX(-4deg)}60%{filter:hue-rotate(-90deg);transform:translateX(-2px)}80%{filter:none;transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.dcard,.drawtoast,.icard,.ieff,.ipop{animation-duration:.01s!important}}

.prow .fields{grid-template-columns:repeat(6,minmax(0,1fr))}

.die3d.spinning .cube{animation:dspin var(--sd,.5s) linear var(--sdel,0s) infinite!important}
.die3d.spinning.rev .cube{animation-name:dspinR!important}
@keyframes dspinR{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(-360deg) rotateY(-540deg) rotateZ(-180deg)}}
@keyframes dspin{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(360deg) rotateY(720deg) rotateZ(180deg)}}
.spinrow .die3d{--d:58px;cursor:pointer}
.stopbtn{display:block;margin:10px auto 0;min-width:160px;font-size:17px;animation:stopPulse .9s ease-in-out infinite}
@keyframes stopPulse{50%{transform:scale(1.06)}}
.dnum.pop{animation:numPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes numPop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* 目標金額クリアの表示 */
.gflag{width:1em;height:1em;flex:0 0 auto}
.hc.goal{background:linear-gradient(90deg,#fff6dc,#fffdf6);border-color:#e8c56e;box-shadow:0 0 0 1.5px #e8c56e,0 0 10px rgba(232,197,110,.7);animation:goalGlow 1.6s ease-in-out infinite}
.hc .gtag{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-weight:700;font-size:11px;color:#fff;background:#e0a93a;border-radius:999px;padding:0 6px 0 4px;margin-left:2px}
@keyframes goalGlow{50%{box-shadow:0 0 0 1.5px #e8c56e,0 0 16px rgba(232,197,110,1)}}
.pchip.goal{background:linear-gradient(135deg,#fff6dc,#fffdf6 60%);box-shadow:0 0 0 2px #e8c56e,0 0 18px rgba(232,197,110,.55);animation:goalGlow 1.6s ease-in-out infinite;padding-top:24px}
.pchip .gribbon{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e0a93a,#efc463,#e0a93a);background-size:200% 100%;animation:ribbonShine 2.4s linear infinite;padding:2px 0;letter-spacing:.04em}
@keyframes ribbonShine{to{background-position:-200% 0}}
.pchip.goal .ptot b{color:#c98a1a}
.pchip.goal.now::after{top:26px}
.gbar{display:block;width:44px;height:5px;border-radius:3px;background:#efe4d7;overflow:hidden;margin:3px 0 1px}
.gbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#efb3ae,#e8c56e)}
.pchip.goal .gbar i{background:#e0a93a}
.piece .pcrown,.piece .pglow{display:none}
.piece.goal .pcrown{display:block;position:absolute;left:50%;top:-58%;width:70%;transform:translateX(-35%);color:#e0a93a;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));animation:flagWave 1s ease-in-out infinite alternate;z-index:2}
.piece.goal .pcrown svg{width:100%;height:auto;display:block}
.piece.goal .pglow{display:block;position:absolute;left:50%;top:92%;width:150%;aspect-ratio:3/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(232,197,110,.95),rgba(232,197,110,0));animation:glowPulse 1.2s ease-in-out infinite;z-index:-1}
.piece.goal svg{animation:goalHop 1.2s ease-in-out infinite}
.piece.goal.now svg{animation:goalHop .8s ease-in-out infinite}
@keyframes flagWave{from{transform:translateX(-35%) rotate(-6deg)}to{transform:translateX(-35%) rotate(8deg)}}
@keyframes glowPulse{50%{opacity:.45;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes goalHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-22%) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.hc.goal,.pchip.goal,.piece.goal svg,.pcrown,.pglow{animation:none!important}}
.piece.goal{z-index:3}
.piece.goal svg{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #e8c56e) drop-shadow(0 0 9px #e8c56e)}
.piece.goal>svg{transform-origin:50% 90%;scale:1.35}
.piece.goal .pcrown{width:110%;top:-95%;transform:translateX(-30%)}
@keyframes flagWave{from{transform:translateX(-30%) rotate(-6deg)}to{transform:translateX(-30%) rotate(8deg)}}
.piece.goal .pglow{width:220%}

/* タイトル・プレイヤー・成績 */
.titlescr{display:flex;flex-direction:column;gap:8px}
.titlescr .keyart{aspect-ratio:400/300}
.titlescr .hero.night,.setup .hero.night{background:#101736;border-color:#2b3668}
.tnote{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.sheet.titlesheet .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet.titlesheet .sheet-actions .btn.primary{grid-column:1/-1;font-size:19px;padding:12px}
.pmodal{position:fixed;inset:0;z-index:70;background:rgba(75,68,83,.35);display:grid;place-items:center;padding:16px}
/* gentle sign-off veil shown when the player ends the game */
#endVeil{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 30%,#fff8ec,#ffe9d6 55%,#ffd9c2);opacity:0;transition:opacity .9s ease}
#endVeil.on{opacity:1}
#endVeil .ebox{display:flex;flex-direction:column;align-items:center;gap:8px;animation:eFloat 2.6s ease-in-out infinite;text-align:center}
#endVeil .eface{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#eef5e8;box-shadow:0 0 0 4px #fff,0 0 0 6px #8fc6a8;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#endVeil .eface svg{width:84%;height:84%;display:block}
#endVeil b{font-size:26px;color:#7a5a48;letter-spacing:.06em}
#endVeil small{font-size:14px;color:#a08b7a}
@keyframes eFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pmcard{width:min(420px,100%);max-height:90vh;overflow:auto;background:#fffdfa;border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(60,40,30,.25);display:flex;flex-direction:column;gap:10px;animation:sheetin .25s ease}
.pmcard h3{margin:0;font-size:18px}
.pmact{display:flex;gap:8px;justify-content:flex-end}
.tplinks{display:flex;justify-content:center;gap:6px}
/* save slots */
.pmodal.slots .pmcard{width:min(640px,100%)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;overflow:auto;min-height:0}

.prow{grid-template-columns:1fr!important}

.pl-mapback::after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);animation:plBackShine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes plBackPulse{0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(75,68,83,.35),0 0 0 0 rgba(255,166,48,.5)}50%{transform:scale(1.08);box-shadow:0 12px 32px rgba(75,68,83,.42),0 0 0 10px rgba(255,166,48,0)}}

.pl-main{padding-top:16px;min-width:0}

.pl-side .pl-mmwrap{position:relative;width:max-content}

.sheet.plpick #sheetActions{display:none}
/* round 111: pick rows never change with hand count — fixed-size cards in ONE row (sideways scroll when many), hover still enlarges via the peek float */
.sheet.plpick .peek.crow{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.sheet.plpick .peek.crow>.card,.sheet.plpick .peek.crow>.pwrap,.sheet.plpick .peek.crow>.vstgt{flex:0 0 auto}
/* round 41 (pattern B): in tall windows the pick sheets widen too, so the cards stay full-size */
.sheet.plpick:not(.two) .sheet-card{width:min(1000px,calc(100vw - 24px));max-height:94vh}
.sheet.plpick:not(.two) .peek .card{width:150px}

.sheet.plpick.plstacked .pl-detail{margin-top:10px}
.sheet.two.plpick .sheet-card{grid-template-columns:minmax(0,1fr)}
/* skill screen: less top padding on the left, and a matching squeeze of the right stack, so the
   whole block sits higher while the card/detail tops stay aligned */
.sheet.skillpick .pl-main{padding-top:0}
.sheet.skillpick .pl-main>p.muted{margin-top:0}
.sheet.skillpick .plrow{margin-top:36px}
.sheet.skillpick .pl-side{--mmcell:10px;--mmgap:1px}
.sheet.skillpick .pl-sidehd{margin-bottom:2px}
.sheet.skillpick .pl-detail{margin-top:0}
