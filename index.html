@keyframes vfitGood{0%,100%{background:#e3f1e6}50%{background:#c9ecd2}}
@keyframes vfitBad{0%,100%{background:#f8e3e0}50%{background:#f2c9c2}}
.vi .vfit .arw{color:var(--muted);font-weight:400}
.vi .vnote{color:var(--muted);font-size:11.5px;line-height:1.45}
.vi .vfx{font-family:var(--f-num);font-weight:800;font-size:22px;color:#c4615a}
#peek{flex-direction:column;align-items:center;width:240px!important;padding:12px 14px 14px}

#peek .vi{width:100%}
#peek.inline{display:none}

.vi .vrow{display:flex;flex-direction:column;gap:7px}

.vinline:empty:not([style]){display:none}
/* square info */
.tv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center}
.tv-art{border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.tv-art svg{display:block;width:100%;height:auto}
.tv-side{display:flex;flex-direction:column;gap:8px}
.tv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.tv-big{font-family:var(--f-num);font-size:26px;font-weight:800;line-height:1}

.tv-own{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,#fff);font-weight:800;font-size:13px}

.bmroul{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}

.bgame .gbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.bgame .gbtns .btn{flex:1 1 140px}
.vfind{position:relative;height:170px;border-radius:16px;background:linear-gradient(160deg,#eef3ea,#f7efe6);overflow:hidden;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 1px var(--line)}

.vfind .cross::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}.vfind .cross::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
.vfind .cnr{position:absolute;width:18px;height:18px;border:3px solid #4b4453;opacity:.55}
.vfind .cnr.a{left:10px;top:10px;border-right:0;border-bottom:0}.vfind .cnr.b{right:10px;top:10px;border-left:0;border-bottom:0}
.vfind .cnr.c{left:10px;bottom:10px;border-right:0;border-top:0}.vfind .cnr.e{right:10px;bottom:10px;border-left:0;border-top:0}
.vmon{position:absolute;width:84px;height:63px;transform:translate(-50%,-50%);pointer-events:none}
.vmon svg{width:100%;height:100%}
.vflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.gacha{display:flex;align-items:center;justify-content:center;gap:16px}
.gmach svg{width:62px;height:72px}
.gcaps{display:flex;gap:10px}
.gcap{width:62px;height:62px;border-radius:50%;border:2px solid #4b4453;background:linear-gradient(180deg,#f3eee8 50%,#fff 50%);font:inherit;font-weight:800;font-size:18px;color:#4b4453;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:default}

.gcap.open{background:linear-gradient(180deg,var(--gc) 50%,#fff 50%);animation:gradepop .35s}

.gcap.spin{animation:capspin .45s linear}
@keyframes capspin{to{transform:rotate(360deg)}}
.gcap.landD{animation:landD .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes landD{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.kai{display:flex;flex-direction:column;gap:10px}
.kbill{display:flex;align-items:baseline;gap:12px;justify-content:center;background:#fff;border-radius:6px;padding:8px 12px;box-shadow:0 2px 8px rgba(75,68,83,.1);font-family:var(--f-num)}
.kbill small{color:var(--muted);font-weight:700}.kbill>b{font-size:28px}
.kbill span{font-size:13px;color:var(--muted)}.kbill span b{font-size:18px;color:var(--ink)}.kbill span b.over{color:#c0605a}
.kcoins{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:440px;align-self:center}

.kc.k500{border-width:3px}

.kc:disabled{cursor:default}
.hilo{display:flex;align-items:center;justify-content:center;gap:16px}

.sym{font-size:40px;font-weight:800;line-height:1}

/* the player chips and map buttons sit in a bar above the map, never on top of it */
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.mapbar .hud{position:static!important;inset:auto;flex:1 1 auto;min-width:0;pointer-events:auto}
.mapctl{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto}
.mapbar .mapbtn{position:static!important;padding:5px 12px}

.mapbar .zbtns button{width:32px;height:32px}

/* roll / skill buttons copied into the map bar while the real ones are scrolled out of sight */
.qact{display:flex;gap:6px}.qact[hidden]{display:none}

@keyframes qin{from{transform:scale(.7);opacity:0}}
/* squares react to the pointer so it is clear they can be tapped for details */
@media (hover:hover){
  .tile{transition:transform .15s,box-shadow .15s,filter .15s}
  .viewport:not(.dragging) .tile:hover{transform:translateY(-2px) scale(1.06);z-index:2;box-shadow:0 0 0 2.5px var(--orange),0 8px 18px rgba(75,68,83,.22);filter:saturate(1.15) brightness(1.03)}
  .viewport:not(.dragging) .tile:hover::after{content:"i";position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--orange);color:#fff;font:800 10px/15px Quicksand,sans-serif;text-align:center;pointer-events:none}
  .viewport .tile{cursor:pointer}
}
/* map: drag to move, wheel / pinch / buttons to zoom */
.viewport{touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.viewport *{-webkit-user-drag:none}
.maphint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(75,68,83,.82);color:#fff;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;pointer-events:none;animation:appear .3s}

const FLOWER_STROKES={

function flowerWord(word,x0,y0){
  const cols=['#ff5d8f','#ff9f1c','#ffd23f','#51cf66','#4dabf7','#b197fc'], F=(x,y,k)=>{ const c=cols[k%6], r=3.9;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(k*37)%72})">${[0,1,2,3,4].map(j=>`<circle cx="${(Math.cos(j*1.2566)*r).toFixed(2)}" cy="${(Math.sin(j*1.2566)*r).toFixed(2)}" r="3.4" fill="${c}" stroke="rgba(10,16,36,.45)" stroke-width=".5"/>`).join('')}<circle r="2" fill="#fff3b0" stroke="rgba(10,16,36,.35)" stroke-width=".4"/></g>`; };
  let k=0;
  return [...word].map((ch,li)=>{ const pts=[];
    for(const st of FLOWER_STROKES[ch]||[]) for(let i=0;i<st.length-1;i++){ const [ax,ay]=st[i],[bx,by]=st[i+1], n=Math.max(1,Math.round(Math.hypot(bx-ax,by-ay)/7.2));
      for(let j=(i===0?0:1);j<=n;j++) pts.push([ax+(bx-ax)*j/n, ay+(by-ay)*j/n]); }
    const x=x0+li*72, under=(FLOWER_STROKES[ch]||[]).map(st=>`<path d="M${st.map(([px,py])=>`${px} ${py}`).join(' L')}" stroke="#ffe9f4" stroke-opacity=".5" stroke-width="8.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
    return `<g class="wig wsoft"><g transform="translate(${x} ${y0})">${under}${pts.map(([px,py])=>F(px,py,k++)).join('')}</g></g>`; }).join('');
}

    for(let ch=0;ch<2;ch++){ const x=ir.getChannelData(ch); for(let k=0;k<len;k++) x[k]=(Math.random()*2-1)*Math.pow(1-k/len,3.5)*(k<sr*.012?k/(sr*.012):1); }

const strum=(v,t,vol,dest)=>v.forEach((n,k)=>pluck(n,t+k*.011,vol,dest,-.15+k*.1));
const rim=(t,vol,dest)=>{ voice({f:1750,t,dur:.008,wave:'triangle',vol,a:.001,d:.03,s:.01,r:.02,dest,pan:.3}); nz({t,dur:.025,vol:vol*.6,freq:2600,q:2,dest,pan:.3}); };
const shaker=(t,vol,dest)=>nz({t,dur:.06,vol,type:'highpass',freq:6500,a:.012,dest,pan:-.35});
function playCalm(tr,i,t,sp,bus){
  const L=tr.bars*16, s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  if(q===0){ strum(ch.v.map(n=>n-12), t, .028, bus); voice({f:mf(ch.r),t,dur:sp*7,wave:'sine',vol:.13,a:.01,d:.5,s:.3,r:.4,dest:bus,wet:.35}); }
  if(q===8) voice({f:mf(ch.r+7),t,dur:sp*5,wave:'sine',vol:.07,a:.01,d:.4,s:.25,r:.3,dest:bus,wet:.35});
  if(m){ const d=m[1]*sp*.95; if(b%2===0) bell(m[0],t,.05,.5,bus,.12); else voice({f:mf(m[0]),t,dur:d,wave:'sine',vol:.07,a:.06,d:.35,s:.75,r:.25,dest:bus,wet:.4,vib:m[1]>=6?4:0}); }
}
function playRace(tr,i,t,sp,bus){
  const L=tr.bars*16, s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  if(q===0) voice({f:mf(ch.r),t,dur:sp*3,wave:'triangle',vol:.16,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus});
  if(q===8) voice({f:mf(ch.r+7),t,dur:sp*3,wave:'triangle',vol:.13,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus});
  if(q===4||q===12) strum(ch.v,t,.022,bus);
  if(q%4===2) shaker(t,.014,bus);
  if(m){ pluck(m[0],t,.09,bus); if(m[1]>=4) bell(m[0]+12,t,.03,.3,bus); }
}

// the tag bar (bar 33) of the 33-bar tunes: a rising bass run into the loop point
const tagRun=(ch,t,sp,bus)=>{ [0,4,7,12].forEach((iv,k)=>voice({f:mf(ch.r+iv),t:t+k*sp*4,dur:sp*3,wave:'triangle',vol:k===3?.15:.14,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus})); };
function playSamba(tr,i,t,sp,bus){
  const L=tr.bars*16, s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  const tag=b===32;
  if(tag){ if(q===0) tagRun(ch,t,sp,bus); }
  else if(q%2===0) voice({f:mf(ch.r+(q===12?7:0)),t,dur:sp*3,wave:'triangle',vol:q%4===0?.17:.13,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus});
  if(!tag && q%4===2) ch.v.forEach(n=>voice({f:mf(n),t,dur:sp*1.4,wave:'triangle',vol:.045,a:.003,d:.1,s:.1,r:.05,cut:1800,dest:bus}));
  shaker(t, tag ? (q%2===0?.05:.02) : (q%2===0?.042:.02), bus);
  if(q===0 || (tag && q===8)) kick(t,.16,bus);
  if(q===8 || (tag && (q===4||q===12))) rim(t,.055,bus);
  if(m){ const dd=m[1]*sp*.92; voice({f:mf(m[0]),t,dur:dd,wave:'sine',vol:.085,a:.04,d:.3,s:.8,r:.2,dest:bus,wet:.3,vib:m[1]>=4?6:0}); }
}
function playJump(tr,i,t,sp,bus){
  const L=tr.bars*16, s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  const tag=b===32;
  if(tag){ if(q===0) tagRun(ch,t,sp,bus); }
  else { if(q===0||q===4||q===8) voice({f:mf(ch.r),t,dur:sp*3,wave:'triangle',vol:.16,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus});
    if(q===12) voice({f:mf(ch.r+7),t,dur:sp*3,wave:'triangle',vol:.13,a:.005,d:.3,s:.2,r:.1,cut:600,dest:bus});
    if(q===14) voice({f:mf(ch.r),t,dur:sp*1.6,wave:'triangle',vol:.12,a:.005,d:.2,s:.15,r:.08,cut:600,dest:bus}); }
  if(!tag && q%4===2) ch.v.forEach(n=>voice({f:mf(n),t,dur:sp*1.4,wave:'triangle',vol:.05,a:.003,d:.1,s:.1,r:.05,cut:1800,dest:bus}));
  if(q%2===0 || tag) shaker(t, q%4===0?.04:.026, bus);
  if(q===0||q===8) kick(t,.17,bus);
  if(q===4||q===12) rim(t,.06,bus);
  if(m){ voice({f:mf(m[0]),t,dur:m[1]*sp*.9,wave:'triangle',vol:.075,a:.01,d:.25,s:.6,r:.15,cut:2400,dest:bus,wet:.25}); }
}

function playAozora(tr,i,t,sp,bus){
  const L=tr.bars*16, s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  const sec=Math.floor(b/8), lastBar=b===31;
  // pop bass: root on 1, 2 and 3, fifth on 4 with a pickup; the ten section halves it, the last bar rests on the root
  if(lastBar){ if(q===0) voice({f:mf(ch.r),t,dur:sp*6,wave:'sine',vol:.15,a:.01,d:.5,s:.3,r:.4,dest:bus,wet:.3}); }
  else if(sec===2){ if(q===0) voice({f:mf(ch.r),t,dur:sp*5,wave:'sine',vol:.15,a:.008,d:.4,s:.3,r:.3,dest:bus,wet:.3}); if(q===8) voice({f:mf(ch.r+7),t,dur:sp*5,wave:'sine',vol:.11,a:.008,d:.4,s:.25,r:.3,dest:bus,wet:.3}); }
  else { if(q===0||q===4||q===8) voice({f:mf(ch.r),t,dur:sp*4,wave:'sine',vol:.15,a:.008,d:.4,s:.3,r:.3,dest:bus,wet:.3});
    if(q===12) voice({f:mf(ch.r+7),t,dur:sp*4,wave:'sine',vol:.12,a:.008,d:.35,s:.25,r:.25,dest:bus,wet:.3});
    if(q===14) voice({f:mf(ch.r),t,dur:sp*2,wave:'sine',vol:.1,a:.008,d:.25,s:.2,r:.2,dest:bus,wet:.3}); }
  // block chords on the beats
  if(q%4===0) ch.v.forEach(n=>voice({f:mf(n),t,dur:sp*3.2,wave:'triangle',vol:q===0?.04:.03,a:.005,d:.3,s:.3,r:.2,cut:1900,dest:bus,wet:.25}));
  // light pop percussion; the ki section and the last bar keep only quarter-note shakers
  if(sec===0 || lastBar){ if(q%4===0) shaker(t,.022,bus); }
  else { if(q%2===0) shaker(t, q%4===0?.034:.02, bus); if(q===0) kick(t,.11,bus); if(q===8) rim(t,.04,bus); }
  // flute lead
  if(m){ const dd=m[1]*sp*.92; voice({f:mf(m[0]),t,dur:dd,wave:'sine',vol:.08,a:.04,d:.3,s:.8,r:.2,dest:bus,wet:.35,vib:m[1]>=4?5:0}); }
}
function playStep(tr,name,i,t,sp,bus){
  if(name==='calm') return playCalm(tr,i,t,sp,bus);
  if(name==='race') return playRace(tr,i,t,sp,bus);
  if(name==='samba') return playSamba(tr,i,t,sp,bus);
  if(name==='jump') return playJump(tr,i,t,sp,bus);
  if(name==='aozora') return playAozora(tr,i,t,sp,bus);
  if(name==='menu') return playMenu(tr,i,t,sp,bus);
  if(name==='ceremony') return playCeremony(tr,i,t,sp,bus);
  const L=tr.bars*16, loopN=Math.floor(i/L), s=i%L, b=Math.floor(s/16), q=s%16, ch=tr.chords[b], m=tr.mel[s];
  const bat=name==='battle';
  // shaker on every 16th, accents on the off-beats
  shaker(t,(q%4===2?.05:q%2?.018:.03)*(bat?1.3:1),bus);
  // rim clicks on a bossa clave (2 bars)
  const clave=(b%2===0)?[0,6,12]:[4,10];
  if(clave.includes(q)) rim(t,bat?.06:.045,bus);
  // upright bass: root on 1, fifth on 3 (with a pickup), samba surdo feel in battle
  if(q===0) voice({f:mf(ch.r),t,dur:sp*5,wave:'triangle',vol:bat?.17:.22,a:.006,d:.35,s:.35,r:.12,cut:520,cutEnv:500,dest:bus});
  if(q===8 || (bat && q===14)) voice({f:mf(ch.r+7),t,dur:sp*(q===14?1.6:5),wave:'triangle',vol:bat?.14:.18,a:.006,d:.3,s:.3,r:.1,cut:520,cutEnv:500,dest:bus});
  if(!bat && q===6) voice({f:mf(ch.r+7),t,dur:sp*1.4,wave:'triangle',vol:.1,a:.006,d:.12,s:.2,r:.06,cut:480,dest:bus});
  if(bat && q===8) kick(t,.2,bus);
  // guitar comping (thumb + fingers), classic syncopated bossa pattern
  const comp=bat ? ((b%2===0)?[0,3,6,10,12,14]:[2,6,8,11,14]) : ((b%2===0)?[0,3,6,10,13]:[2,6,10,12]);
  if(comp.includes(q)) strum(ch.v,t,bat?.045:.04,bus);
  // melody: breathy flute in the field (vibes on alternate loops), muted-trumpet-ish lead in battle
  if(m){
    const d=m[1]*sp*.92;
    if(bat){ voice({f:mf(m[0]),t,dur:d,wave:'sawtooth',vol:.05,a:.02,d:.2,s:.7,r:.12,cut:1300,cutEnv:900,q:2,dest:bus,wet:.25,dly:.12,vib:m[1]>=4?10:0});
      voice({f:mf(m[0]),t,dur:d,wave:'sine',vol:.05,a:.02,d:.2,s:.7,r:.12,dest:bus}); }
    else if(loopN%2===0){ voice({f:mf(m[0]),t,dur:d,wave:'sine',vol:.085,a:.05,d:.3,s:.8,r:.2,dest:bus,wet:.35,dly:.12,vib:m[1]>=4?7:0}); nz({t,dur:Math.min(d,.25),vol:.012,freq:mf(m[0])*2,q:3,a:.04,dest:bus}); }
    else bell(m[0],t,.07,.45,bus,.15);
  }
}
function bgm(name,force){
  if(name===SND.track && SND.timer && SND.mode==='all' && !force) return;
  SND.track=name;
  if(SND.timer){ clearInterval(SND.timer); SND.timer=null; }
  const c=SND.ctx;
  if(c && SND.bgmBus){ const old=SND.bgmBus; old.gain.setTargetAtTime(0,c.currentTime,.12); setTimeout(()=>old.disconnect(),1500); SND.bgmBus=null; }
  if(!name || !c || SND.mode!=='all') return;
  const bus=SND.bgmBus=gainN(0,SND.master); bus.gain.setTargetAtTime(BGM_VOL,c.currentTime,.08);
  SND.step=0; SND.next=c.currentTime+.08;
  SND.timer=setInterval(()=>{
    const tr=TRACKS[SND.track]; if(!tr || SND.bgmBus!==bus) return;
    const sp=60/tr.bpm/4;
    if(SND.next < c.currentTime-.2) SND.next=c.currentTime+.02; // tab was asleep: skip ahead instead of bursting
    while(SND.next < c.currentTime+.3){ playStep(tr,SND.track,SND.step,SND.next,sp,bus); SND.next+=sp; SND.step++; }
  },100); // round 97: 30ms->100ms polling (0.3s lookahead keeps it gapless) — fewer wakeups on phones
}

// rare skills (card stealing) come up 3x less often than the other items
const pickItem=()=>{ const ks=Object.keys(ITEMS), w=ks.map(k=>ITEMS[k].rare?1:ITEMS[k].w||3), sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum; for(let k=0;k<ks.length;k++){ if((r-=w[k])<0) return ks[k]; } return ks[0]; };
function buildDeck(starter){
  const d = [mk('mon',starter)];
  const pool = COMMONS.filter(k=>!STARTERS.includes(k));
  for(let i=0;i<11;i++) d.push(mk('mon',pick(pool)));
  for(let i=0;i<3;i++) d.push(mk('item','i1'));
  for(let i=0;i<3;i++) d.push(mk('item','i2'));
  for(let i=0;i<2;i++) d.push(mk('item','i3'));
  for(const id of ['s1','s1','s2','s3','s4','i7','i10','s8','s9','s10','s18']) d.push(mk('item',id));
  if(Math.random()<.5) d.push(mk('item','i8'));
  for(const id of ['s5','s6','s7']) if(Math.random()<1/3) d.push(mk('item',id));
  // starter goes into the opening hand
  const rest = shuffle(d.slice(1));
  return [d[0], ...rest];
}

// 胃の下スッパイデス工業のプレゼント候補：防御プラス系 / サイコロが増える系 / レア系モンスター / 先制ベル
// florist gift (user, 2026-10-27): a random monster from the whole roster — the fused forms (incl. Last Hankoron)
// are not roster cards, so they can never appear. Stronger monsters are rarer: weight = (45 / (atk+hp))^3,
// so the weakest (Hankoron, 45) is likeliest and the mightiest kira (~110) is about 1/15 as likely.
function flowerGift(){
  const ids = Object.keys(MONS);
  let tot = 0; const ws = ids.map(id => { const m = MONS[id], w = Math.pow(45 / (m.atk + m.hp), 3); tot += w; return w; });
  let r = Math.random() * tot;
  for (let i = 0; i < ids.length; i++){ r -= ws[i]; if (r <= 0) return ids[i]; }
  return ids[ids.length - 1];
}

// ---------- derived values ----------
function landValue(i){const t=S.tiles[i]; return t.mon ? MONS[t.mon.id].cost + 100*(t.level-1) : 0}
function total(pi){const p=S.players[pi]; let v=p.cash; S.tiles.forEach((t,i)=>{if(t.owner===pi) v+=landValue(i)}); return v}
// fixed event money scales with the current leader's total assets N (user, 2026-10-27):
// x1 while N<1250, then +0.5 for every further 1250 (1250-2499: x1.5, 2500-3749: x2, ...)
function evMult(){ const N=Math.max(...S.players.map((_,j)=>total(j))); return 1+0.5*Math.floor(N/1250); }
function evPay(y){ return Math.round(y*evMult()/10)*10; } // granted amounts are rounded to the nearest 10 (no amounts ending in 5)
function chainCount(i){const t=S.tiles[i]; return S.tiles.filter((u,j)=>u.owner===t.owner && TILES[j].area===TILES[i].area).length}
// ボッタクリ看板: N枚重なると通行料は (N+1) 倍（N回目の使用は (N+1)/N 倍ずつ増える）。旧セーブの boost は1枚扱い
const ripN = t => t.ripN || (t.boost ? 1 : 0);
const ripMult = t => { const n = ripN(t); return n ? n + 1 : 1; };
function toll(i, ripOverride){
  const t=S.tiles[i], m=MONS[t.mon.id];
  let v = m.cost*0.5*[1,2,3][t.level-1]*(1+0.3*(chainCount(i)-1));
  if(m.place===TILES[i].place) v*=1.2;
  const rn = ripOverride!=null ? ripOverride : ripN(t);
  if(rn) v*=(rn+1);
  return Math.ceil(v/10)*10;
}
// cheering: own monsters lined up on the squares next to the battle square, counted outward in both directions (max 4)
const SUP_MAX=4, SUP_HP=15, SUP_ATK=5;
function support(i, who=S.tiles[i].owner){
  const N=S.tiles.length; let n=0;
  for(const dir of [-1,1]) for(let k=1;k<N && n<SUP_MAX;k++){ const t=S.tiles[((i+dir*k)%N+N)%N]; if(t.owner!==who || !t.mon) break; n++; }
  return n;
}
function defBonus(i){const t=S.tiles[i], m=MONS[t.mon.id], n=support(i); return {match:m.place===TILES[i].place?20:0, level:10*(t.level-1), support:SUP_HP*n, supAtk:SUP_ATK*n, cheer:n}}
function log(msg){S.log.push(msg); if(S.log.length>40) S.log.shift(); renderLog()}
// 先制スキル: decided once per monster card, the first time it is drawn or gotten (about 4%)
const FIRST_RATE=.04;
function rollFirst(c){ if(c && c.kind==='mon' && c.fr==null){ c.fr=1; if(Math.random()<FIRST_RATE) c.first=1; } return c; }
function drawCard(p,n=1,over=false){
  let got=0; drawCard.last=[];
  for(let k=0;k<n;k++){
    if(!over && p.hand.length>=HAND_MAX) break;
    if(!p.deck.length){ if(!p.discard.length) break; p.deck = shuffle(p.discard); p.discard=[]; }
    const c=rollFirst(p.deck.shift()); c.fresh=1; p.hand.push(c); drawCard.last.push(c); got++;
  }
  return got;
}

function choose(opts){
  skipPause();
  bandStreak=0; clearTimeout(bandIdleT); // a choice breaks any run of dialogue
  return new Promise(res=>{
    const box=$('#sheetActions'); box.innerHTML='';
    opts.forEach(o=>{
      const b=document.createElement('button'); b.type='button';
      b.className='btn'+(o.primary?' primary':'')+(o.wide?' opt':'')+(o.stack?' stack':'')+((o.card||o.tile)?' cardopt':'')+(o.cls?' '+o.cls:''); // カードやタイルで選ぶ選択肢は下のテキストボタンを出さず、カード画像そのものをクリックして選ぶ
      b.innerHTML=o.label; b.disabled=!!o.disabled;
      if(o.card){
        b.addEventListener('pointerenter',e=>{ if(e.pointerType!=='touch') peekCard(b,o); });
        b.addEventListener('pointerleave',e=>{ if(e.pointerType!=='touch') hidePeek(); });
        b.addEventListener('focus',()=>peekCard(b,o));
        b.addEventListener('pointerdown',e=>{ choose.pt=e.pointerType; choose.pre=peekCard.btn; });
      }
      b.addEventListener('click',()=>{
        if(o.card && choose.pt==='touch' && choose.pre!==b){ peekCard(b,o,true); return; }
        hidePeek(); box.innerHTML=''; res(o.value); syncAwait();
      });
      box.appendChild(b); o.btn=b;
    });
    choose.cont=(opts.length===1 && !opts[0].disabled)?opts[0].btn:null; // 選択肢が1つだけ＝結果確認などの「進む」ボタン。文言によらず上のスキップボタンで押せるようにする

async function vsLandChoice(p,pi,i,mons,fee){

    return `<div class="vsopt${rec===o.c.uid?' rec':''}">${rec===o.c.uid?'<span class="recb">おすすめ</span>':''}${cardHTML(o.c).replace(/<\/div>$/,fitBadge(o.c,{vsM:D})+'</div>')}
      <div class="vsx"><span class="mx ${tag[0]}">${ELEM_GLYPH[MONS[o.c.id].elem]}→${ELEM_GLYPH[D.elem]} ${tag[1]}</span><span class="wp"><i style="width:${pct(o.w)}%"></i><b>勝率めやす ${pct(o.w)}%</b></span></div></div>`; };
  const chip=(k,v)=>v?`<span class="bchip"><small>${k}</small>${v}</span>`:'';
  const gauge=o=>{ const tg=o.x>1?['adv','有利 ×1.5']:o.x<1?['dis','不利 ×0.75']:['even','ふつう'];

function photoCands(q, qi, taken){

    for(const [kw,id] of PHOTO_EV){ if(l.includes(kw) && !used.has(id)){ used.add(id); out.push({sub:byId[id], from:l}); break; } }
    if(out.length>=2) break; }
  const defs=PHOTO_SUBS.map(x=>x.id).filter(id=>!used.has(id));
  while(out.length<3 && defs.length){ const id=defs.splice(rnd(defs.length),1)[0]; used.add(id); out.push({sub:byId[id], from:null}); }
  return out.slice(0,3).map(c=>({sub:c.sub, from:c.from, appeal:c.sub.base+rnd(3), flip:rnd(2)===1}));
}

async function chooseItem(player, role, fighter, brief, nums){

function bonusCards(){

async function hankoronRecycle(p, card){
  if(!S || S.tut || Math.random()>=.5) return;
  const others=S.players.filter(q=>q!==p);
  if(!others.length) return;
  const di=p.discard.indexOf(card); if(di<0) return;
  p.discard.splice(di,1);
  const holders=others.filter(q=>q.hand.some(c=>isHanko(c)));
  const to=holders.length?pick(holders):pick(others);
  const pref=holders.includes(to);
  log(`シルバー人材センダーが、捨てられた${cardName(card)}を回収して${to.name}に届けた。`);
  await notice('🚚 シルバー人材センダー', `<div class="spotev"><div class="recwrap">${recycleSVG()}</div><p>捨てられた「${esc(cardName(card))}」を、<b>シルバー人材センダー</b>のおじいさんが回収しました！</p><p>軽トラに乗せて、${pref?`ハンコロンをすでに持っている <b>${esc(to.name)}</b> さんのもとへ、優先的にお届けします。`:`<b>${esc(to.name)}</b> さんのもとへお届けします。`}</p></div>`, S.players.every(q=>q.cpu));
  giveCard(to, card); renderHand(); renderPlayers();
  if(to.hand.length>HAND_MAX) await discardDown(to);
}

// what counts as a strong card (user, 2026-10-28): monsters — a kira, a rare, or a normal one carrying 先制;
// skills — a rare one, the invisibility cloak (only once it has joined the deck), the first-strike bell,
// the warp, a dice increaser, or ゼイキンビーム (collects 10% from everyone);
// battle items — the first-strike bell or a rare item.
function isStrongCard(c){
  if(c.kind==='mon') return c.id.endsWith('k') || !!MONS[c.id].rare || !!c.first;
  const it=ITEMS[c.id]; if(!it) return false;
  if(it.skill) return !!it.rare || c.id==='s25' || c.id==='s18' || c.id==='s16' || DICE_CARDS.includes(c.id) || c.id==='s2';
  return !!it.rare;
}
function strongCardFor(c){
  if(c.kind==='mon'){
    const pool=[...Object.keys(MONS).filter(id=>id.endsWith('k')), ...RARES, 'F','F','F','F','F','F','F','F','F','F','F','F'];
    const id=pick(pool);
    if(id!=='F') return mk('mon', id);
    const m=mk('mon', pick(COMMONS)); m.fr=1; m.first=1; return m; // a normal monster with 先制
  }
  const it=ITEMS[c.id];
  if(it && it.skill){
    const pool=[...Object.keys(ITEMS).filter(id=>ITEMS[id].skill && ITEMS[id].rare), ...(S && S.added10 ? ['s25'] : []), 's18', 's16', ...DICE_CARDS, 's2'];
    return mk('item', pick([...new Set(pool)]));
  }
  return mk('item', pick(['s18', ...Object.keys(ITEMS).filter(id=>!ITEMS[id].skill && ITEMS[id].rare)]));
}
function powerUpCard(c){ return isStrongCard(c) ? c : strongCardFor(c); }

  if(!p.cpu) await choose([{label:'チャレンジ！',value:1,primary:1}]); else await sleep(500);
  const slot=$('#slot');
  const g=await timing(p, slot, `${p.name}：真ん中でストップ！`, timingProfile(prize.kind,prize.id));
  slot.innerHTML='';
  // a sweet-spot stop powers the prize up into a strong card of its category (user, 2026-10-28)
  let powered=false;
  if(g==='s' && !isStrongCard(prize)){ prize=powerUpCard(prize); powered=true; bigText('パワーアップ！！','#f5a83b',1000); }

    drawn=drawn.map(c=>{ if(isStrongCard(c)) return c;
      const u=powerUpCard(c); u.fresh=1; const hi=p.hand.indexOf(c); if(hi>=0) p.hand[hi]=u; drawnUp++; return u; });
  }
  const name = prize.kind==='mon'?MONS[prize.id].name:ITEMS[prize.id].name;
  const full = n<want && p.hand.length>=HAND_MAX;
  const msg = (g==='s'?'スイートスポット！ ':'')+(win?`${name}をゲット！`+(powered?'（パワーアップ！）':'')+(toDeck?'（手札がいっぱいなので山札の一番上へ）':'')+' ':'')

// canvas fireworks: rockets rise, burst into pastel sparks; returns a stop function.
// Kept light: no shadowBlur, 1x resolution, sparks drawn in one path per colour and fade step,
// glows stamped from a pre-rendered sprite, a spark cap, and fewer sparks when frames run slow.
function fireworks(){
  const cv=document.createElement('canvas'); cv.id='fw'; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); let W=0,H=0;
  const size=()=>{ W=innerWidth; H=innerHeight; cv.width=W; cv.height=H; }; size(); addEventListener('resize',size);

  const MAX=420, rockets=[], sparks=[], flashes=[]; let alive=true, last=performance.now(), next=0, slow=0, q=1;
  const launch=()=>{ rockets.push({x:W*(.15+Math.random()*.7), y:H+10, vy:-(H*.0011+Math.random()*H*.0004), ty:H*(.15+Math.random()*.3), c:pick(COLS)}); };

    for(let k=0;k<n;k++){ const a=k/n*Math.PI*2+Math.random()*.1, sp=(ring?.17:.06+Math.random()*.13)*Math.min(W,H)/400; sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:k%2?r.c:c2,tw:Math.random()<.3}); }
    flashes.push({x:r.x,y:r.y,life:1});
    sfx('boom'); };

  const step=t=>{
    const dt=Math.min(40,t-last); last=t;
    // frames taking longer than ~22ms for a while: launch less and burst smaller
    slow=slow*.9+(dt>22?1:0)*.1; q=slow>.5?.55:slow>.25?.8:1;
    if(alive && t>next){ launch(); if(q===1 && Math.random()<.35) launch(); next=t+(380+Math.random()*520)/q; }
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(let i=flashes.length-1;i>=0;i--){ const f=flashes[i]; f.life-=dt/260; if(f.life<=0){ flashes.splice(i,1); continue; } ctx.globalAlpha=.8*f.life; ctx.drawImage(glow,f.x-70,f.y-70,140,140); }
    ctx.globalCompositeOperation='source-over';
    for(let i=rockets.length-1;i>=0;i--){ const r=rockets[i]; r.y+=r.vy*dt; ctx.fillStyle=r.c; ctx.globalAlpha=.9; ctx.fillRect(r.x-2,r.y-2,4,4);
      ctx.globalAlpha=.35; ctx.fillRect(r.x-1,r.y,2,14); if(r.y<=r.ty){ burst(r); rockets.splice(i,1); } }
    // move sparks, then bucket them by colour and fade step so each bucket is one stroke call
    const buckets=new Map();
    let n=0;
    for(let i=0;i<sparks.length;i++){ const p=sparks[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=.00012*dt; p.vx*=.985; p.vy*=.985; p.life-=dt/1500;
      if(p.life<=0) continue; sparks[n++]=p;
      const a=p.tw ? p.life*(.4+.6*Math.abs(Math.sin(t/60+i))) : p.life, lv=Math.min(STEPS-1,Math.floor(a*STEPS)), key=p.c+lv;
      let b=buckets.get(key); if(!b){ b={c:p.c,lv,pts:[]}; buckets.set(key,b); } b.pts.push(p); }
    sparks.length=n;
    ctx.lineCap='round';
    for(const b of buckets.values()){ const a=(b.lv+.5)/STEPS; ctx.globalAlpha=a; ctx.strokeStyle=b.c; ctx.lineWidth=3.4*a+1; ctx.beginPath();
      for(const p of b.pts){ ctx.moveTo(p.x-p.vx*55,p.y-p.vy*55); ctx.lineTo(p.x,p.y); } ctx.stroke(); }
    ctx.globalAlpha=1;
    if(alive || rockets.length || sparks.length) requestAnimationFrame(step); else { cv.remove(); removeEventListener('resize',size); }
  };
  requestAnimationFrame(step);
  return ()=>{ alive=false; };
}

function statName(key, fallback){

function statFace(key, ent, k){

function recordResult(order){

function summarize(e, n){
  const rows = n ? [e.n[n]||[]] : [2,3,4].map(m=>e.n[m]||[]);
  let games=0, rankSum=0, wins=0;
  rows.forEach(arr=>arr.forEach((c,k)=>{ games+=c; rankSum+=c*(k+1); if(k===0) wins+=c; }));
  return {games, wins, avg: games? rankSum/games : 0};
}

function tip(key){
  if(!S || !S.tut || S.tut.seen[key] || !TUT[key]) return Promise.resolve();
  S.tut.seen[key]=1; save();
  const T=TUT[key], n=Object.keys(S.tut.seen).length;
  return new Promise(res=>{
    const w=document.createElement('div'); w.id='coach';
    const tgt=T.sel?$(T.sel):null;
    if(tgt){ tgt.scrollIntoView({block:'center',behavior:'smooth'}); tgt.classList.add('tut-hl'); }
    const low=tgt && (()=>{ const r=tgt.getBoundingClientRect(); return r.top+r.height/2>innerHeight*.5; })();
    w.innerHTML=`<div class="cocard${low?' top':''}" role="dialog" aria-modal="true" aria-label="${esc(T.t)}"><span class="coface">${portrait('m6')}</span>
      <div class="cobody"><small>ハンコロン（案内役） ・ チュートリアル ${n}</small><b>${esc(T.t)}</b><p>${T.b(P())}</p></div>
      <div class="coact"><button type="button" class="btn ghost sm" data-q>チュートリアルをやめる</button><button type="button" class="btn primary" data-ok>わかった！</button></div></div>`;
    document.body.appendChild(w);
    const done=()=>{ document.removeEventListener('keydown',onKey,true); w.remove(); if(tgt) tgt.classList.remove('tut-hl'); res(); };
    const onKey=e=>{ e.stopPropagation(); if(e.key==='Enter'||e.key===' '){ e.preventDefault(); w.querySelector('[data-ok]')?.click(); } };
    document.addEventListener('keydown',onKey,true);
    w.querySelector('[data-ok]').onclick=done;
    w.querySelector('[data-q]').onclick=()=>{
      w.querySelector('.cobody').innerHTML=`<b>チュートリアルをやめますか？</b><p>説明なしの<b>通常モード</b>に切り替えて、このまま続きを遊べます。</p>`;
      w.querySelector('.coact').innerHTML=`<button type="button" class="btn ghost sm" data-back>チュートリアルを続ける</button><button type="button" class="btn primary" data-end>通常モードへ</button>`;
      w.querySelector('[data-back]').onclick=()=>{ w.remove(); document.removeEventListener('keydown',onKey,true); if(tgt) tgt.classList.remove('tut-hl'); delete S.tut.seen[key]; tip(key).then(res); };
      w.querySelector('[data-end]').onclick=()=>{ endTutorial(); done(); };
    };
    setTimeout(()=>w.querySelector('[data-ok]')?.focus({preventScroll:true}),60);
  });
}

const TUT_CORE=['hand','roll','place','enemy','timing'];

// turn order: everyone rolls three dice, highest total goes first; tied players roll again until they are split
async function orderRoll(my){
  const P0=S.players.slice(), score=P0.map(()=>[]);
  const row=(p,i)=>`<div class="orow" data-i="${i}" style="--c:${p.color}"><span class="orank"></span><span class="oface">${avatarHTML(p)}</span><b class="oname">${esc(p.name)}</b><span class="odice">${dieHTML()}${dieHTML()}${dieHTML()}</span><span class="osum">？</span></div>`;
  // 順番決めの前に、勝ち方とスタート資金をシンプルに伝える
  openSheet('ゲームの目標', `<div class="goalpop"><div class="ghead"><span class="coface">${portrait('m6')}</span><span><b class="gname">ハンコロン</b><small>案内役</small></span></div><p>ぼくは案内役のハンコロン！ まず、このゲームの目標を説明するね。</p><p>全プレイヤー、資金 <b>${START_CASH}G</b> を持ってスタート！</p><p><b>目標金額 ${S.target.toLocaleString('ja-JP')}</b> を集めてから、上尾駅に戻ってきてね。</p><p>目標金額を集めて、<b>上尾駅</b> に最初に戻ってきた人が <b>優勝</b> だよ！</p></div>`);
  if(P0.some(p=>!p.cpu)) await choose([{label:'わかった！',value:1,primary:1}]); else await sleep(2000);
  if(my!==gen) return;
  openSheet('順番決め', `<p class="muted">サイコロを3個ずつ振って、合計が大きい人から1番・2番…の順になります。同じ数なら、その人たちだけ振り直し！</p><div class="order">${P0.map(row).join('')}</div><p class="onote" id="oNote"></p>`, 'order');
  if(P0.some(p=>!p.cpu)) await choose([{label:'🎲 サイコロを振る',value:1,primary:1}]); else await sleep(600);
  if(my!==gen) return;
  // groups of tied players, best first; a group of one is settled
  let groups=[P0.map((_,i)=>i)];
  for(let round=0; groups.some(g=>g.length>1); round++){
    const rolling=groups.filter(g=>g.length>1).flat();
    if(round){ $('#oNote').textContent='同点！ もう一度振ります'; sfx('level'); await sleep(1100); if(my!==gen) return; }
    const rolls={}; rolling.forEach(i=>{ rolls[i]=[1+rnd(6),1+rnd(6),1+rnd(6)]; });
    rolling.forEach(i=>{ const el=$(`.orow[data-i="${i}"]`); el.classList.add('rolling'); el.querySelector('.osum').textContent='…'; el.querySelectorAll('.die3d').forEach(d=>{ d.style.setProperty('--sd',(0.44+Math.random()*0.16).toFixed(2)+'s'); d.style.setProperty('--sdel',(-Math.random()*0.5).toFixed(2)+'s'); d.classList.add('spinning'); }); });
    if(P0.some(p=>!p.cpu)){
      const stopBtn=document.createElement('button'); stopBtn.type='button'; stopBtn.className='btn primary'; stopBtn.textContent='ストップ！'; $('#sheetActions').appendChild(stopBtn);
      let otk=0; const tiv=setInterval(()=>diceSfx(6,(otk++)%3),170);
      await waitDiceStop([stopBtn, $('#sheetBody')], 1700);
      clearInterval(tiv); stopBtn.remove();
    } else { for(let k=0;k<6;k++){ diceSfx(6,k%3); await sleep(110); } }
    const diceEls=[]; rolling.forEach(i=>{ $(`.orow[data-i="${i}"]`).querySelectorAll('.die3d').forEach((d,k)=>diceEls.push({i,d,v:rolls[i][k]})); });
    for(let a=diceEls.length-1;a>0;a--){ const b=rnd(a+1); const tmp=diceEls[a]; diceEls[a]=diceEls[b]; diceEls[b]=tmp; }
    const left={}; rolling.forEach(i=>left[i]=3);
    for(let n=0;n<diceEls.length;n++){
      if(n){ await sleep(120+rnd(110)); if(my!==gen) return; }
      const q=diceEls[n];
      q.d.classList.remove('spinning'); q.d.style.removeProperty('--sd'); q.d.style.removeProperty('--sdel');
      setDie(q.d,q.v,true); sfx('stop');
      if(--left[q.i]===0){ const el=$(`.orow[data-i="${q.i}"]`), t=rolls[q.i].reduce((a,b)=>a+b,0); score[q.i].push(t); el.classList.remove('rolling'); el.querySelector('.osum').textContent=score[q.i].join(' → '); }
    }
    sfx('ok'); $('#oNote').textContent='';
    // split each tied group by this round's total
    groups=groups.flatMap(g=>{ if(g.length<2) return [g]; const by={}; g.forEach(i=>{ const t=score[i][score[i].length-1]; (by[t]=by[t]||[]).push(i); }); return Object.keys(by).map(Number).sort((a,b)=>b-a).map(t=>by[t]); });
    const order=groups.flat(); let rank=1;
    groups.forEach(g=>{ g.forEach(i=>{ const el=$(`.orow[data-i="${i}"]`); el.querySelector('.orank').textContent=g.length>1?'同点':`${rank}番`; el.classList.toggle('tie',g.length>1); el.style.order=order.indexOf(i); }); rank+=g.length; });
    await sleep(900); if(my!==gen) return;
  }
  const order=groups.flat();
  $('#oNote').innerHTML=`<b>${esc(P0[order[0]].name)}</b> が1番です！`; sfx('turn');
  S.players=order.map(i=>P0[i]);
  S.viewer=S.players.findIndex(p=>!p.cpu); if(S.viewer<0) S.viewer=0;
  log('順番：'+S.players.map((p,k)=>`${k+1}番 ${p.name}`).join('、'));
  if(P0.some(p=>!p.cpu)) await choose([{label:'この順番ではじめる',value:1,primary:1}]); else await sleep(1200);
  closeSheet(); save(); render();
}

// setup pulldowns: the native select sits invisibly on top of a two-line label, so long names wrap instead of being cut
const psel=(id,aria,opts,cap='')=>`<label class="psel"><span class="pv"></span><select id="${id}" aria-label="${aria}"${cap?` data-cap="${cap}"`:''}>${opts}</select></label>`;
function pselShow(sel){
  const o=sel.options[sel.selectedIndex], t=o?o.textContent:'', pv=sel.previousElementSibling; let m;
  if(sel.dataset.cap) pv.innerHTML=`<small>${esc(sel.dataset.cap)}</small><b>${esc(t)}</b>`;
  else if((m=t.match(/^(.+?)：(.+)$/))) pv.innerHTML=`<small>${esc(m[1])}</small><b>${esc(m[2])}</b>`;
  else if((m=t.match(/^(.+?)（(.+)）$/))) pv.innerHTML=`<b>${esc(m[1])}</b><small>${esc(m[2])}</small>`;
  else pv.innerHTML=`<b>${esc(t)}</b>`;
}

        ${r.cpu ? psel(`ct${i}`,`${i+1}PのCPUタイプ`,[['いつものCPU',v=>!v.char],['いろんなキャラ',v=>v.char&&!v.abil],['特殊キャラ（能力つき）',v=>!!v.abil]].map(([l,f])=>`<optgroup label="${l}">${Object.entries(CPU_TYPES).filter(([k,v])=>f(v)).map(([k,v])=>`<option value="${k}"${r.ctype===k?' selected':''}>${v.abil?ABIL[v.abil].icon+' ':''}${k}（${v.short}）</option>`).join('')}</optgroup>`).join(''))

      </div></div>`).join('')}
